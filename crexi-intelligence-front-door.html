<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crexi Intelligence — Front Door</title>
<style data-src="lib/colors_and_type.css">
/* ============================================================
   CUI (Crexi UI) — Colors & Type
   ============================================================
   Derived from the CUI design system:
   - Primitives: Gray / Blue / Teal / Purple / Red / Orange / Green
   - Semantic: cui-color-text, cui-color-surface, cui-color-status,
               cui-color-border, cui-color-interaction, cui-shadow
   Font families: Proxima Nova (product UI / display — licensed, Montserrat fallback)
                  Literata (branding / marketing headers)
                  JetBrains Mono (code + monospace)
   All headings are Semibold (600). Product uses Sentence case.
   ============================================================ */

/* --- Webfonts: Proxima Nova (product, via Montserrat fallback) + Literata (branding) + JetBrains Mono --- */
@import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400&family=JetBrains+Mono:wght@400;500&display=swap");

:root {
  /* =========================================================
     PRIMITIVES — extended palette (10 stops)
     Hex values follow the Product Colors board.
     ========================================================= */

  /* Gray — OFFICIAL CUI */
  --cui-gray-50:  #F6F6F6;
  --cui-gray-100: #ECECEC;
  --cui-gray-200: #E6E6E6;
  --cui-gray-300: #D8D8D8;
  --cui-gray-400: #B4B4B4;
  --cui-gray-500: #979797;
  --cui-gray-600: #6E6E6E;
  --cui-gray-700: #5B5B5B;
  --cui-gray-800: #3C3C3C;
  --cui-gray-900: #1C1C1C;
  --cui-white-000: #FFFFFF;
  --cui-black-000: #000000;

  /* Blue (primary brand) — OFFICIAL CUI */
  --cui-blue-50:  #ECF1FC;
  --cui-blue-100: #D3E2FF;
  --cui-blue-200: #A5BEF3;
  --cui-blue-300: #789DE4;
  --cui-blue-400: #5082DA;
  --cui-blue-500: #2B7DE3;
  --cui-blue-600: #0A63CB;   /* primary accent */
  --cui-blue-700: #195392;
  --cui-blue-800: #15334E;
  --cui-blue-900: #062239;   /* headings / dark surfaces */

  /* Teal — OFFICIAL CUI */
  --cui-teal-50:  #DFFEFF;
  --cui-teal-100: #C8FDFD;
  --cui-teal-200: #B3EFF4;
  --cui-teal-300: #80DADF;
  --cui-teal-400: #5FCBCF;
  --cui-teal-500: #4DBABD;
  --cui-teal-600: #48ACAD;
  --cui-teal-700: #479D9D;
  --cui-teal-800: #3E8C8C;
  --cui-teal-900: #356E6B;

  /* Purple — OFFICIAL CUI */
  --cui-purple-50:  #FFEDFF;
  --cui-purple-100: #EFD6FF;
  --cui-purple-200: #CEADFF;
  --cui-purple-300: #AC83FF;
  --cui-purple-400: #9363F9;
  --cui-purple-500: #7B44EE;
  --cui-purple-600: #7041EA;
  --cui-purple-700: #6337DE;
  --cui-purple-800: #5331D7;
  --cui-purple-900: #3525C8;

  /* Red — OFFICIAL CUI */
  --cui-red-50:  #FFE7ED;
  --cui-red-100: #FFC9CE;
  --cui-red-200: #FF9490;
  --cui-red-300: #F46D69;
  --cui-red-400: #FE4D42;
  --cui-red-500: #FF3C24;
  --cui-red-600: #F03125;
  --cui-red-700: #EA2626;
  --cui-red-800: #C20B07;
  --cui-red-900: #9A0300;

  /* Orange — OFFICIAL CUI */
  --cui-orange-50:  #FFF8EE;
  --cui-orange-100: #FDD9AB;
  --cui-orange-200: #FDC37B;
  --cui-orange-300: #FDAD48;
  --cui-orange-400: #FD9C22;
  --cui-orange-500: #FF8D00;
  --cui-orange-600: #FF8200;
  --cui-orange-700: #F57106;
  --cui-orange-800: #EE6108;
  --cui-orange-900: #E5430D;

  /* Green — OFFICIAL CUI */
  --cui-green-50:  #E0FDEA;
  --cui-green-100: #CCE8D6;
  --cui-green-200: #A3D7B6;
  --cui-green-300: #78C896;
  --cui-green-400: #59BD80;
  --cui-green-500: #32B26A;
  --cui-green-600: #2BA360;
  --cui-green-700: #208F53;
  --cui-green-800: #147E47;
  --cui-green-900: #0B6134;

  /* Brand gradient — Crexi Intelligence */
  --cui-intel-gradient: linear-gradient(135deg, #0A63CB 0%, #7041EA 100%);

  /* =========================================================
     SEMANTIC TOKENS — Light mode defaults
     ========================================================= */

  /* Text */
  --cui-color-text-primary:     var(--cui-blue-900);
  --cui-color-text-secondary:   var(--cui-gray-600);
  --cui-color-text-placeholder: var(--cui-gray-600);
  --cui-color-text-disabled:    var(--cui-gray-500);
  --cui-color-text-on-primary:  var(--cui-white-000);
  --cui-color-text-link:        var(--cui-blue-600);

  /* Surface */
  --cui-color-surface-background: var(--cui-white-000);
  --cui-color-surface-container:  var(--cui-gray-50);
  --cui-color-surface-primary:    var(--cui-blue-600);
  --cui-color-surface-disabled:   var(--cui-gray-100);
  --cui-color-surface-contrast:   var(--cui-gray-900);
  --cui-color-surface-backdrop:   rgba(28, 28, 28, 0.45);

  /* Status */
  --cui-color-status-success: var(--cui-green-800);
  --cui-color-status-warning: var(--cui-orange-800);
  --cui-color-status-error:   var(--cui-red-800);
  --cui-color-status-info:    var(--cui-blue-600);

  --cui-color-status-success-bg: var(--cui-green-50);
  --cui-color-status-warning-bg: var(--cui-orange-50);
  --cui-color-status-error-bg:   var(--cui-red-50);
  --cui-color-status-info-bg:    var(--cui-blue-50);

  /* Border */
  --cui-color-border-default: var(--cui-gray-300);
  --cui-color-border-hover:   var(--cui-gray-700);
  --cui-color-border-active:  var(--cui-blue-600);

  /* Interaction veils */
  --cui-interaction-default-hovered: rgba(28, 28, 28, 0.08);
  --cui-interaction-default-pressed: rgba(28, 28, 28, 0.26);
  --cui-interaction-blue-hovered:    rgba(10, 99, 203, 0.08);
  --cui-interaction-blue-pressed:    rgba(10, 99, 203, 0.26);
  --cui-interaction-colorful-hovered:rgba(28, 28, 28, 0.15);

  /* =========================================================
     SHADOWS — 2-layer drop shadows per spec
     ========================================================= */
  --cui-shadow-1:
    0px 1px 2px 0px rgba(28,28,28,0.08),
    0px 1px 4px 1px rgba(28,28,28,0.12);
  --cui-shadow-2:
    0px 2px 2px 0px rgba(28,28,28,0.08),
    0px 4px 8px 2px rgba(28,28,28,0.12);
  --cui-shadow-3:
    0px 4px 4px 0px rgba(28,28,28,0.08),
    0px 8px 16px 3px rgba(28,28,28,0.12);
  --cui-shadow-4:
    0px 8px 8px 0px rgba(28,28,28,0.12),
    0px 16px 32px 4px rgba(28,28,28,0.20);

  --cui-focus-ring-active: 0 0 0 1px var(--cui-color-surface-background), 0 0 0 3px var(--cui-color-border-active);
  --cui-focus-ring-error:  0 0 0 1px var(--cui-color-surface-background), 0 0 0 3px var(--cui-red-600);

  /* =========================================================
     CORNER RADIUS
     ========================================================= */
  --cui-radius-sm:   4px;   /* buttons, inputs, map markers */
  --cui-radius-md:   8px;   /* menus, alerts, button groups */
  --cui-radius-lg:   12px;  /* cards, modals, containers */
  --cui-radius-full: 9999px;/* chips, badges, avatars */

  /* =========================================================
     SPACING — 4px baseline grid
     ========================================================= */
  --cui-s-reset: 0px;
  --cui-s-1:  2px;
  --cui-s-2:  4px;
  --cui-s-3:  8px;
  --cui-s-4:  12px;
  --cui-s-5:  16px;
  --cui-s-6:  20px;
  --cui-s-7:  24px;
  --cui-s-8:  32px;
  --cui-s-9:  36px;
  --cui-s-10: 40px;
  --cui-s-11: 48px;
  --cui-s-12: 56px;
  --cui-s-13: 64px;

  /* =========================================================
     TYPOGRAPHY
     Product:  Proxima Nova  (substitute: Montserrat via Google Fonts)
     Branding: Literata       (served via Google Fonts)
     Mono:     JetBrains Mono
     Both product + branding use Sentence case and Semibold (600) for H1-H6.
     ========================================================= */
  --cui-font-sans:    "Proxima Nova", "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --cui-font-display: "Proxima Nova", "Montserrat", -apple-system, BlinkMacSystemFont, sans-serif;
  --cui-font-brand:   "Literata", Georgia, "Times New Roman", serif;
  --cui-font-mono:    "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  /* Product type scale — size / line-height (pt ≈ px in web) */
  --cui-type-h1-size: 64px;  --cui-type-h1-lh: 72px;
  --cui-type-h2-size: 56px;  --cui-type-h2-lh: 64px;
  --cui-type-h3-size: 40px;  --cui-type-h3-lh: 48px;
  --cui-type-h4-size: 32px;  --cui-type-h4-lh: 40px;
  --cui-type-h5-size: 24px;  --cui-type-h5-lh: 32px;
  --cui-type-h6-size: 20px;  --cui-type-h6-lh: 28px;
  --cui-type-body-size:    16px; --cui-type-body-lh:    24px;   /* Body / Body-semi */
  --cui-type-body2-size:   14px; --cui-type-body2-lh:   20px;   /* Body2 / Body2-semi */
  --cui-type-desc-size:    12px; --cui-type-desc-lh:    16px;   /* Description */
  --cui-type-caption-10-size: 10px; --cui-type-caption-10-lh: 14px;  /* Caption · 10pt · ALL CAPS */

  /* Legacy aliases — kept so existing components don't break */
  --cui-type-d1-size: var(--cui-type-h1-size); --cui-type-d1-lh: var(--cui-type-h1-lh);
  --cui-type-caption-size:  var(--cui-type-desc-size);  --cui-type-caption-lh:  var(--cui-type-desc-lh);
  --cui-type-overline-size: 11px; --cui-type-overline-lh: 14px;

  --cui-fw-regular: 400;
  --cui-fw-medium:  500;
  --cui-fw-semi:    600;   /* default heading weight */
  --cui-fw-bold:    700;
  --cui-fw-heavy:   800;
}

/* =========================================================
   WEBFONTS
   Proxima Nova is a licensed face — swap the @import for your
   Adobe Fonts / Typekit kit URL in production. Montserrat is
   the free fallback (very close metrics).
   ========================================================= */
@import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400&display=swap");

/* =========================================================
   SEMANTIC TOKENS — Dark mode
   ========================================================= */
[data-theme="dark"] {
  --cui-color-text-primary:     var(--cui-white-000);
  --cui-color-text-secondary:   var(--cui-gray-300);
  --cui-color-text-placeholder: var(--cui-gray-300);
  --cui-color-text-disabled:    var(--cui-gray-400);
  --cui-color-text-on-primary:  var(--cui-blue-900);
  --cui-color-text-link:        var(--cui-blue-300);

  --cui-color-surface-background: var(--cui-blue-900);
  --cui-color-surface-container:  var(--cui-blue-800);
  --cui-color-surface-primary:    var(--cui-white-000);
  --cui-color-surface-disabled:   var(--cui-gray-800);
  --cui-color-surface-contrast:   var(--cui-gray-50);
  --cui-color-surface-backdrop:   rgba(248, 246, 246, 0.45);

  --cui-color-status-success: var(--cui-green-200);
  --cui-color-status-warning: var(--cui-orange-200);
  --cui-color-status-error:   var(--cui-red-200);
  --cui-color-status-info:    var(--cui-blue-200);

  --cui-color-border-default: var(--cui-gray-500);
  --cui-color-border-hover:   var(--cui-gray-200);
  --cui-color-border-active:  var(--cui-blue-400);
}

/* =========================================================
   SEMANTIC TYPE CLASSES
   ========================================================= */
/* ---- Product headings (Proxima Nova · Semibold · Sentence case) ---- */
.cui-h1       { font-family: var(--cui-font-sans); font-weight: var(--cui-fw-semi);
                font-size: var(--cui-type-h1-size);  line-height: var(--cui-type-h1-lh);
                letter-spacing: -0.015em; color: var(--cui-color-text-primary); }
.cui-h2       { font-family: var(--cui-font-sans); font-weight: var(--cui-fw-semi);
                font-size: var(--cui-type-h2-size);  line-height: var(--cui-type-h2-lh);
                letter-spacing: -0.01em;  color: var(--cui-color-text-primary); }
.cui-h3       { font-family: var(--cui-font-sans); font-weight: var(--cui-fw-semi);
                font-size: var(--cui-type-h3-size);  line-height: var(--cui-type-h3-lh);
                letter-spacing: -0.005em; color: var(--cui-color-text-primary); }
.cui-h4       { font-family: var(--cui-font-sans); font-weight: var(--cui-fw-semi);
                font-size: var(--cui-type-h4-size);  line-height: var(--cui-type-h4-lh);
                color: var(--cui-color-text-primary); }
.cui-h5       { font-family: var(--cui-font-sans); font-weight: var(--cui-fw-semi);
                font-size: var(--cui-type-h5-size);  line-height: var(--cui-type-h5-lh);
                color: var(--cui-color-text-primary); }
.cui-h6       { font-family: var(--cui-font-sans); font-weight: var(--cui-fw-semi);
                font-size: var(--cui-type-h6-size);  line-height: var(--cui-type-h6-lh);
                color: var(--cui-color-text-primary); }

/* ---- Body styles (Proxima Nova) ---- */
.cui-body      { font-family: var(--cui-font-sans); font-weight: var(--cui-fw-regular);
                 font-size: var(--cui-type-body-size); line-height: var(--cui-type-body-lh);
                 color: var(--cui-color-text-primary); }
.cui-body-semi { font-family: var(--cui-font-sans); font-weight: var(--cui-fw-semi);
                 font-size: var(--cui-type-body-size); line-height: var(--cui-type-body-lh);
                 color: var(--cui-color-text-primary); }
.cui-body2     { font-family: var(--cui-font-sans); font-weight: var(--cui-fw-regular);
                 font-size: var(--cui-type-body2-size); line-height: var(--cui-type-body2-lh);
                 color: var(--cui-color-text-primary); }
.cui-body2-semi{ font-family: var(--cui-font-sans); font-weight: var(--cui-fw-semi);
                 font-size: var(--cui-type-body2-size); line-height: var(--cui-type-body2-lh);
                 color: var(--cui-color-text-primary); }
.cui-description { font-family: var(--cui-font-sans); font-weight: var(--cui-fw-regular);
                   font-size: var(--cui-type-desc-size); line-height: var(--cui-type-desc-lh);
                   color: var(--cui-color-text-secondary); }
.cui-caption-10 { font-family: var(--cui-font-sans); font-weight: var(--cui-fw-regular);
                  font-size: var(--cui-type-caption-10-size); line-height: var(--cui-type-caption-10-lh);
                  text-transform: uppercase; letter-spacing: 0.06em;
                  color: var(--cui-color-text-secondary); }

/* ---- Branding headings (Literata · Semibold · marketing surfaces only) ---- */
.cui-brand-h1 { font-family: var(--cui-font-brand); font-weight: var(--cui-fw-semi);
                font-size: var(--cui-type-h1-size); line-height: var(--cui-type-h1-lh);
                letter-spacing: -0.015em; color: var(--cui-color-text-primary); }
.cui-brand-h2 { font-family: var(--cui-font-brand); font-weight: var(--cui-fw-semi);
                font-size: var(--cui-type-h2-size); line-height: var(--cui-type-h2-lh);
                letter-spacing: -0.01em; color: var(--cui-color-text-primary); }
.cui-brand-h3 { font-family: var(--cui-font-brand); font-weight: var(--cui-fw-semi);
                font-size: var(--cui-type-h3-size); line-height: var(--cui-type-h3-lh);
                color: var(--cui-color-text-primary); }
.cui-brand-h4 { font-family: var(--cui-font-brand); font-weight: var(--cui-fw-semi);
                font-size: var(--cui-type-h4-size); line-height: var(--cui-type-h4-lh);
                color: var(--cui-color-text-primary); }
.cui-brand-h5 { font-family: var(--cui-font-brand); font-weight: var(--cui-fw-semi);
                font-size: var(--cui-type-h5-size); line-height: var(--cui-type-h5-lh);
                color: var(--cui-color-text-primary); }
.cui-brand-h6 { font-family: var(--cui-font-brand); font-weight: var(--cui-fw-semi);
                font-size: var(--cui-type-h6-size); line-height: var(--cui-type-h6-lh);
                color: var(--cui-color-text-primary); }

/* ---- Legacy utility classes (kept for prior components) ---- */
.cui-display  { font-family: var(--cui-font-sans); font-weight: var(--cui-fw-semi);
                font-size: var(--cui-type-h1-size); line-height: var(--cui-type-h1-lh);
                letter-spacing: -0.02em; color: var(--cui-color-text-primary); }
.cui-caption  { font-family: var(--cui-font-sans); font-weight: var(--cui-fw-regular);
                font-size: var(--cui-type-desc-size); line-height: var(--cui-type-desc-lh);
                color: var(--cui-color-text-secondary); }
.cui-overline { font-family: var(--cui-font-sans); font-weight: var(--cui-fw-semi);
                font-size: var(--cui-type-overline-size); line-height: var(--cui-type-overline-lh);
                letter-spacing: 0.08em; text-transform: uppercase;
                color: var(--cui-color-text-secondary); }
.cui-mono     { font-family: var(--cui-font-mono); font-size: 13px; line-height: 18px; }

/* Element defaults — apply .cui-reset to a root to adopt */
.cui-reset, .cui-reset * { box-sizing: border-box; }
.cui-reset {
  font-family: var(--cui-font-sans);
  font-size: var(--cui-type-body-size);
  line-height: var(--cui-type-body-lh);
  color: var(--cui-color-text-primary);
  background: var(--cui-color-surface-background);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.cui-reset h1 { font: var(--cui-fw-semi) var(--cui-type-h1-size)/var(--cui-type-h1-lh) var(--cui-font-sans); letter-spacing: -0.015em; margin: 0; }
.cui-reset h2 { font: var(--cui-fw-semi) var(--cui-type-h2-size)/var(--cui-type-h2-lh) var(--cui-font-sans); letter-spacing: -0.01em; margin: 0; }
.cui-reset h3 { font: var(--cui-fw-semi) var(--cui-type-h3-size)/var(--cui-type-h3-lh) var(--cui-font-sans); margin: 0; }
.cui-reset h4 { font: var(--cui-fw-semi) var(--cui-type-h4-size)/var(--cui-type-h4-lh) var(--cui-font-sans); margin: 0; }
.cui-reset h5 { font: var(--cui-fw-semi) var(--cui-type-h5-size)/var(--cui-type-h5-lh) var(--cui-font-sans); margin: 0; }
.cui-reset h6 { font: var(--cui-fw-semi) var(--cui-type-h6-size)/var(--cui-type-h6-lh) var(--cui-font-sans); margin: 0; }
.cui-reset p  { margin: 0; }
.cui-reset a  { color: var(--cui-color-text-link); text-decoration: none; }
.cui-reset a:hover { text-decoration: underline; }
.cui-reset code { font-family: var(--cui-font-mono); font-size: 13px; background: var(--cui-gray-100); padding: 1px 4px; border-radius: var(--cui-radius-sm); }

</style>
<style data-src="styles.css">
/* ============================================================
   Crexi Intelligence — Front Door (Quiet Search)
   App styles · built on CUI tokens
   ============================================================ */

*{box-sizing:border-box;}
html,body,#root{height:100%;}
body{
  margin:0;
  font-family:var(--cui-font-sans);
  color:var(--cui-color-text-primary);
  background:var(--cui-white-000);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea{font-family:inherit;}
::selection{background:var(--cui-blue-100);}

/* tiny utilities */
.ico-svg{display:inline-block;vertical-align:-0.14em;flex:none;}
.mono{font-family:var(--cui-font-mono);}
.fade-up{animation:fadeUp .5s cubic-bezier(.22,.61,.36,1) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideInRight{from{opacity:0;transform:translateX(28px);}to{opacity:1;transform:none;}}
@keyframes pop{0%{transform:scale(.96);opacity:0;}100%{transform:scale(1);opacity:1;}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* ============================================================
   TOP BAR
   ============================================================ */
.appbar{
  height:64px;display:flex;align-items:center;gap:var(--cui-s-5);
  padding:0 var(--cui-s-6);
  border-bottom:1px solid var(--cui-color-border-default);
  background:var(--cui-white-000);
  position:sticky;top:0;z-index:40;
}
.appbar__menu{
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  color:var(--cui-blue-900);font-size:18px;border-radius:var(--cui-radius-md);
  transition:background .15s;
}
.appbar__menu:hover{background:var(--cui-interaction-default-hovered);}
.appbar__brand{display:flex;align-items:center;}
.appbar__logo{height:22px;width:auto;display:block;}
.appbar__nav{display:flex;align-items:center;gap:var(--cui-s-6);margin-left:var(--cui-s-4);}
.appbar__navlink{
  font-size:15px;font-weight:var(--cui-fw-med);color:var(--cui-blue-900);
  text-decoration:none;white-space:nowrap;transition:color .15s;
}
.appbar__navlink:hover{color:var(--cui-blue-600);}
.appbar__navlink.is-active{color:var(--cui-blue-600);font-weight:var(--cui-fw-semi);}
.appbar__navsep{width:1px;height:22px;background:var(--cui-color-border-default);}
.appbar__spacer{flex:1;}
.appbar__link{
  font-size:15px;font-weight:var(--cui-fw-semi);color:var(--cui-blue-600);
  text-decoration:none;white-space:nowrap;
}
.appbar__link:hover{text-decoration:underline;}
.appbar__action{
  font-size:15px;font-weight:var(--cui-fw-med);color:var(--cui-blue-900);
  text-decoration:none;white-space:nowrap;
}
.appbar__action:hover{color:var(--cui-blue-600);}

.avatar{
  width:34px;height:34px;border-radius:var(--cui-radius-full);
  background:var(--cui-gray-200);color:var(--cui-gray-700);display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:var(--cui-fw-semi);border:1px solid rgba(0,0,0,.06);
}
.iconbtn{
  width:38px;height:38px;border-radius:var(--cui-radius-md);display:flex;align-items:center;justify-content:center;
  color:var(--cui-gray-600);font-size:16px;transition:background .15s;
}
.iconbtn:hover{background:var(--cui-interaction-default-hovered);}
.iconbtn.active{background:var(--cui-blue-50);color:var(--cui-blue-700);}

/* ============================================================
   HOME — Quiet Search
   ============================================================ */
.home{
  min-height:calc(100% - 64px);
  display:flex;flex-direction:column;align-items:center;
  padding:0 var(--cui-s-7) var(--cui-s-13);
  background:
    radial-gradient(1100px 460px at 50% -8%, rgba(10,99,203,.05), transparent 70%),
    var(--cui-white-000);
}
.home__inner{width:100%;max-width:980px;margin-top:clamp(48px,10vh,120px);}
.home__hero{max-width:720px;margin:0 auto;}

.greeting{text-align:center;margin-bottom:var(--cui-s-9);}
.greeting .eyebrow{
  font-size:13px;font-weight:var(--cui-fw-semi);letter-spacing:.02em;
  color:var(--cui-gray-600);margin-bottom:var(--cui-s-4);
}
.greeting h1{
  font-size:40px;line-height:46px;font-weight:var(--cui-fw-semi);
  letter-spacing:-.02em;color:var(--cui-blue-900);margin:0;
}
.greeting h1 .grad{
  background:var(--cui-intel-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}

/* chat input */
.askbox{
  position:relative;display:flex;align-items:flex-end;gap:var(--cui-s-4);
  background:var(--cui-white-000);
  border:1.5px solid var(--cui-color-border-default);
  border-radius:var(--cui-radius-lg);
  padding:var(--cui-s-4) var(--cui-s-4) var(--cui-s-4) var(--cui-s-5);
  box-shadow:var(--cui-shadow-2);
  transition:border-color .18s, box-shadow .18s;
}
.askbox:focus-within{
  border-color:var(--cui-color-border-active);
  box-shadow:0 0 0 4px var(--cui-blue-50), var(--cui-shadow-2);
}
.askbox__spark{
  flex:none;width:26px;height:26px;margin-bottom:2px;border-radius:var(--cui-radius-sm);
  display:flex;align-items:center;justify-content:center;color:var(--cui-blue-600);font-size:15px;
}
.askbox textarea{
  flex:1;min-width:0;border:none;outline:none;resize:none;background:transparent;
  font-size:17px;line-height:24px;color:var(--cui-blue-900);
  padding:3px 0;height:30px;max-height:140px;
  white-space:nowrap;overflow:hidden;
}
.askbox textarea::placeholder{color:var(--cui-gray-500);white-space:nowrap;text-overflow:ellipsis;overflow:hidden;}
.askbox__send{
  flex:none;width:40px;height:40px;border-radius:var(--cui-radius-md);
  background:var(--cui-blue-600);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:15px;transition:background .15s, transform .1s;
}
.askbox__send:hover{background:var(--cui-blue-700);}
.askbox__send:active{transform:scale(.94);}
.askbox__send:disabled{background:var(--cui-gray-200);color:var(--cui-gray-400);cursor:default;}

/* suggested prompts */
.prompts{display:flex;flex-direction:column;align-items:center;gap:var(--cui-s-3);margin-top:var(--cui-s-6);}
.prompts__label{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:var(--cui-fw-semi);letter-spacing:.02em;color:var(--cui-gray-500);text-transform:uppercase;}
.prompts__label .ico-svg{color:var(--cui-blue-600);}
.prompts__label span{color:var(--cui-blue-700);text-transform:none;letter-spacing:0;font-weight:var(--cui-fw-semi);}
.prompts__row{display:flex;flex-wrap:wrap;gap:var(--cui-s-3);justify-content:center;}
.prompt{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 14px;border-radius:var(--cui-radius-full);
  border:1px solid var(--cui-color-border-default);
  background:var(--cui-white-000);
  font-size:13.5px;color:var(--cui-blue-900);font-weight:var(--cui-fw-medium);
  transition:border-color .15s, background .15s, transform .1s;
}
.prompt:hover{border-color:var(--cui-blue-300);background:var(--cui-blue-50);}
.prompt:active{transform:translateY(1px);}
.prompt i{color:var(--cui-gray-500);font-size:12px;}

/* capability cards */
.caps{
  display:grid;grid-template-columns:repeat(3,1fr);gap:var(--cui-s-5);
  margin-top:var(--cui-s-12);
}
.capcard{
  text-align:left;border:1px solid var(--cui-color-border-default);
  border-radius:var(--cui-radius-lg);background:var(--cui-white-000);
  padding:var(--cui-s-6);box-shadow:var(--cui-shadow-1);
  transition:border-color .16s, box-shadow .16s, transform .16s;
  display:flex;flex-direction:column;gap:var(--cui-s-4);min-height:178px;
}
.capcard:hover{border-color:var(--cui-blue-300);box-shadow:var(--cui-shadow-2);transform:translateY(-2px);}
.capcard__ico{
  width:42px;height:42px;border-radius:var(--cui-radius-md);
  display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;
}
.capcard__ico.value{background:linear-gradient(135deg,#0A63CB,#2B7DE3);}
.capcard__ico.site{background:linear-gradient(135deg,#7041EA,#9363F9);}
.capcard__ico.pipe{background:linear-gradient(135deg,#48ACAD,#4DBABD);}
.capcard h3{font-size:17px;font-weight:var(--cui-fw-semi);margin:0;color:var(--cui-blue-900);letter-spacing:-.01em;}
.capcard p{font-size:13.5px;line-height:19px;color:var(--cui-gray-600);margin:0;flex:1;}
.capcard__inc{font-size:11.5px;color:var(--cui-gray-500);display:flex;align-items:center;gap:7px;}
.capcard__inc .arr{margin-left:auto;color:var(--cui-blue-600);font-size:13px;transition:transform .2s;}
.capcard.active{border-color:var(--cui-blue-600);box-shadow:var(--cui-shadow-2);}
.capcard.active .capcard__inc .arr{transform:rotate(90deg);}
.capcard.active::after{content:"";position:absolute;left:50%;bottom:-9px;width:16px;height:16px;background:var(--cui-white-000);border-left:1px solid var(--cui-blue-600);border-top:1px solid var(--cui-blue-600);transform:translateX(-50%) rotate(45deg);z-index:2;}
.capcard{position:relative;}

/* recommended (profile-matched) card */
.capcard.recommended{border-color:var(--cui-blue-300);box-shadow:0 0 0 1px var(--cui-blue-200), var(--cui-shadow-2);padding-top:calc(var(--cui-s-6) + 14px);}
.capcard__rec{position:absolute;top:-11px;left:var(--cui-s-6);display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:var(--cui-fw-semi);letter-spacing:.03em;text-transform:uppercase;color:#fff;background:var(--cui-intel-gradient);border-radius:var(--cui-radius-full);padding:5px 11px;box-shadow:var(--cui-shadow-1);}
.capcard__rec .ico-svg{font-size:10px;}

/* expandable drawer below the 3 cards */
.cap-drawer{
  margin-top:var(--cui-s-6);border:1px solid var(--cui-blue-600);border-radius:var(--cui-radius-lg);
  background:var(--cui-white-000);box-shadow:var(--cui-shadow-2);overflow:hidden;animation:drawer .28s cubic-bezier(.22,.61,.36,1) both;
}
@keyframes drawer{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.cap-drawer__top{display:flex;gap:var(--cui-s-5);padding:var(--cui-s-7);border-bottom:1px solid var(--cui-gray-100);}
.cap-drawer__icon{width:46px;height:46px;border-radius:var(--cui-radius-md);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;}
.cap-drawer__icon.value{background:linear-gradient(135deg,#0A63CB,#2B7DE3);}
.cap-drawer__icon.site{background:linear-gradient(135deg,#7041EA,#9363F9);}
.cap-drawer__icon.pipe{background:linear-gradient(135deg,#48ACAD,#4DBABD);}
.cap-drawer__lead h3{font-size:19px;font-weight:var(--cui-fw-semi);color:var(--cui-blue-900);margin:0 0 6px;letter-spacing:-.01em;}
.cap-drawer__lead p{font-size:14px;line-height:21px;color:var(--cui-gray-600);margin:0;max-width:62ch;}
.cap-drawer__cols{display:grid;grid-template-columns:1fr 1.15fr;gap:0;}
.cap-drawer__col{padding:var(--cui-s-6) var(--cui-s-7);}
.cap-drawer__col + .cap-drawer__col{border-left:1px solid var(--cui-gray-100);}
.cap-drawer__h{font-size:11px;font-weight:var(--cui-fw-semi);text-transform:uppercase;letter-spacing:.05em;color:var(--cui-gray-500);margin:0 0 var(--cui-s-4);}
.toolchips{display:flex;flex-wrap:wrap;gap:8px;}
.toolchip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--cui-blue-800);background:var(--cui-gray-50);border:1px solid var(--cui-gray-200);border-radius:var(--cui-radius-full);padding:6px 12px;font-weight:var(--cui-fw-medium);}
.toolchip .d{width:6px;height:6px;border-radius:2px;transform:rotate(45deg);background:var(--cui-blue-600);}
.startprompts{display:flex;flex-direction:column;gap:9px;}
.startprompt{
  display:flex;align-items:center;gap:11px;text-align:left;width:100%;
  border:1px solid var(--cui-color-border-default);border-radius:var(--cui-radius-md);
  padding:11px 13px;background:var(--cui-white-000);font-size:13.5px;color:var(--cui-blue-900);
  font-weight:var(--cui-fw-medium);transition:border-color .15s, background .15s;
}
.startprompt:hover{border-color:var(--cui-blue-300);background:var(--cui-blue-50);}
.startprompt .q{flex:none;width:24px;height:24px;border-radius:var(--cui-radius-sm);background:var(--cui-blue-50);color:var(--cui-blue-600);display:flex;align-items:center;justify-content:center;font-size:11px;}
.startprompt .go{margin-left:auto;color:var(--cui-blue-600);font-size:12px;opacity:0;transition:opacity .15s, transform .15s;}
.startprompt:hover .go{opacity:1;transform:translateX(2px);}

/* ============================================================
   RECENTS ROW (home "pick up where you left off")
   ============================================================ */
.recents{margin-top:var(--cui-s-9);}
.recents__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--cui-s-4);}
.recents__label{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:var(--cui-fw-semi);color:var(--cui-gray-600);letter-spacing:.01em;}
.recents__label .ico-svg{color:var(--cui-gray-500);font-size:14px;}
.recents__all{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:var(--cui-fw-semi);color:var(--cui-blue-600);background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:var(--cui-radius-sm);transition:background .15s;}
.recents__all:hover{background:var(--cui-blue-50);}
.recents__all .ico-svg{font-size:12px;transition:transform .15s;}
.recents__all:hover .ico-svg{transform:translateX(2px);}
.recents__row{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--cui-s-4);}
.sesscard{display:flex;align-items:center;gap:var(--cui-s-4);text-align:left;background:var(--cui-white-000);border:1px solid var(--cui-color-border-default);border-radius:var(--cui-radius-md);padding:13px var(--cui-s-4);cursor:pointer;transition:border-color .15s, box-shadow .15s, transform .15s;min-width:0;position:relative;}
.sesscard:hover{border-color:var(--cui-blue-300);box-shadow:var(--cui-shadow-1);transform:translateY(-1px);}
.sesscard__ic{flex:none;width:34px;height:34px;border-radius:var(--cui-radius-sm);display:flex;align-items:center;justify-content:center;font-size:15px;}
.sesscard__body{min-width:0;display:flex;flex-direction:column;gap:4px;}
.sesscard__q{font-size:13.5px;font-weight:var(--cui-fw-semi);color:var(--cui-blue-900);line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.sesscard__meta{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--cui-gray-500);white-space:nowrap;overflow:hidden;}
.sesscard__tool{display:inline-flex;align-items:center;gap:5px;font-weight:var(--cui-fw-semi);}
.sesscard__dot{width:7px;height:7px;border-radius:2px;flex:none;}
.sesscard__sep{color:var(--cui-gray-300);}
.sesscard__x{flex:none;width:24px;height:24px;border-radius:var(--cui-radius-full);display:flex;align-items:center;justify-content:center;color:var(--cui-gray-400);font-size:10px;cursor:pointer;opacity:0;transition:opacity .15s, background .15s, color .15s;}
.sesscard:hover .sesscard__x,.sesscard:focus-within .sesscard__x{opacity:1;}
.sesscard__x:hover{background:var(--cui-red-50);color:var(--cui-red-700);}

/* ============================================================
   YOUR LISTINGS WIDGET (home — additive test surface)
   ============================================================ */
.lw{margin-top:var(--cui-s-9);background:var(--cui-white-000);border:1px solid var(--cui-color-border-default);border-radius:var(--cui-radius-lg);box-shadow:var(--cui-shadow-1);overflow:hidden;}
.lw__head{display:flex;align-items:center;justify-content:space-between;gap:var(--cui-s-4);padding:var(--cui-s-5) var(--cui-s-6);}
.lw__title{display:inline-flex;align-items:center;gap:9px;font-size:16px;font-weight:var(--cui-fw-semi);color:var(--cui-blue-900);}
.lw__title .ico-svg{color:var(--cui-blue-600);font-size:17px;}
.lw__headright{display:flex;align-items:center;gap:var(--cui-s-4);}
.lw__viewall{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:var(--cui-fw-semi);color:var(--cui-blue-600);background:none;border:none;cursor:pointer;padding:4px 4px;border-radius:var(--cui-radius-sm);transition:background .15s;}
.lw__viewall:hover{background:var(--cui-blue-50);}
.lw__viewall .ico-svg{font-size:11px;transition:transform .15s;}
.lw__viewall:hover .ico-svg{transform:translateX(2px);}
.lw__more{width:28px;height:28px;border:none;background:none;border-radius:var(--cui-radius-sm);color:var(--cui-gray-400);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;}
.lw__more:hover{background:var(--cui-gray-100);color:var(--cui-gray-700);}

.lw__rows{display:flex;flex-direction:column;}
.lwrow{display:flex;align-items:center;gap:var(--cui-s-5);padding:13px var(--cui-s-6);border-top:1px solid var(--cui-gray-100);cursor:pointer;transition:background .15s;text-align:left;}
.lwrow:hover{background:var(--cui-gray-50);}
.lwrow__thumb{flex:none;width:46px;height:46px;border-radius:var(--cui-radius-md);background:linear-gradient(135deg,var(--cui-blue-100),var(--cui-blue-50));border:1px solid var(--cui-color-border-default);}
.lwrow__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.lwrow__addr{font-size:14.5px;font-weight:var(--cui-fw-semi);color:var(--cui-blue-900);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lwrow__meta{font-size:12.5px;color:var(--cui-gray-500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lwrow__stats{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right;}
.lwrow__stat{font-size:13px;color:var(--cui-gray-600);}
.lwrow__stat b{color:var(--cui-blue-900);font-weight:var(--cui-fw-semi);}
.lw-badge{flex:none;display:inline-flex;align-items:center;font-size:12px;font-weight:var(--cui-fw-semi);padding:4px 11px;border-radius:var(--cui-radius-full);white-space:nowrap;}
.lwrow .lw-badge{min-width:104px;justify-content:center;}
.lw-badge--ok{background:var(--cui-green-50);color:var(--cui-green-800);}
.lw-badge--warn{background:var(--cui-red-50);color:var(--cui-red-800);}
.lw-badge--muted{background:var(--cui-gray-100);color:var(--cui-gray-600);}

.lw__alerts{display:flex;flex-direction:column;border-top:1px solid var(--cui-color-border-default);}
.lwalert{display:flex;align-items:center;gap:var(--cui-s-4);padding:12px var(--cui-s-6);border-top:1px solid var(--cui-gray-100);}
.lwalert:first-child{border-top:none;}
.lwalert__ic{flex:none;width:32px;height:32px;border-radius:var(--cui-radius-sm);display:flex;align-items:center;justify-content:center;font-size:14px;}
.lwalert__ic--warn{background:var(--cui-red-50);color:var(--cui-red-700);}
.lwalert__ic--info{background:var(--cui-blue-50);color:var(--cui-blue-600);}
.lwalert__label{flex:1;min-width:0;font-size:13.5px;color:var(--cui-gray-700);}
.lwalert__cta{flex:none;font-size:13px;font-weight:var(--cui-fw-semi);color:#fff;background:var(--cui-blue-900);border:none;border-radius:var(--cui-radius-sm);padding:8px 18px;cursor:pointer;transition:background .15s;}
.lwalert__cta:hover{background:var(--cui-blue-800);}
.lwalert__save{flex:none;width:30px;height:30px;border:none;background:none;border-radius:var(--cui-radius-sm);color:var(--cui-gray-300);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;}
.lwalert__save:hover{background:var(--cui-gray-100);color:var(--cui-gray-600);}

/* ============================================================
   HISTORY VIEW (full screen)
   ============================================================ */
.history .hist__inner{max-width:860px;}
.hist__head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--cui-s-5);margin-top:clamp(32px,7vh,72px);margin-bottom:var(--cui-s-7);}
.hist__head h1{font-size:34px;line-height:1.1;font-weight:var(--cui-fw-semi);letter-spacing:-.02em;color:var(--cui-blue-900);margin:6px 0 0;}
.hist__head .eyebrow{font-size:13px;font-weight:var(--cui-fw-semi);color:var(--cui-gray-600);}
.hist__controls{display:flex;align-items:center;gap:var(--cui-s-4);margin-bottom:var(--cui-s-7);flex-wrap:wrap;}
.hist__search{display:flex;align-items:center;gap:10px;flex:1;min-width:240px;border:1.5px solid var(--cui-color-border-default);border-radius:var(--cui-radius-md);padding:9px 12px;transition:border-color .15s, box-shadow .15s;}
.hist__search:focus-within{border-color:var(--cui-color-border-active);box-shadow:0 0 0 3px var(--cui-blue-50);}
.hist__search .ico-svg{color:var(--cui-gray-500);font-size:15px;}
.hist__search input{flex:1;border:none;outline:none;background:transparent;font-size:14.5px;color:var(--cui-blue-900);}
.hist__search input::placeholder{color:var(--cui-gray-500);}
.hist__clear{width:20px;height:20px;border-radius:var(--cui-radius-full);border:none;background:var(--cui-gray-100);color:var(--cui-gray-600);display:flex;align-items:center;justify-content:center;font-size:9px;cursor:pointer;}
.hist__clear:hover{background:var(--cui-gray-200);}
.hist__filters{display:flex;gap:7px;flex-wrap:wrap;}
.hist__chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:var(--cui-fw-medium);color:var(--cui-gray-700);background:var(--cui-white-000);border:1px solid var(--cui-color-border-default);border-radius:var(--cui-radius-full);padding:7px 13px;cursor:pointer;transition:all .15s;}
.hist__chip:hover{border-color:var(--cui-blue-300);}
.hist__chip.on{background:var(--cui-blue-50);border-color:var(--cui-blue-600);color:var(--cui-blue-700);}
.hist__chipdot{width:8px;height:8px;border-radius:2px;flex:none;}
.hist__group{margin-bottom:var(--cui-s-7);}
.hist__grouph{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:var(--cui-fw-semi);text-transform:uppercase;letter-spacing:.05em;color:var(--cui-gray-500);margin-bottom:var(--cui-s-4);}
.hist__count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:var(--cui-radius-full);background:var(--cui-gray-100);color:var(--cui-gray-600);font-size:11px;letter-spacing:0;}
.hist__list{display:flex;flex-direction:column;gap:8px;}
.histrow{display:flex;align-items:center;gap:var(--cui-s-4);text-align:left;width:100%;background:var(--cui-white-000);border:1px solid var(--cui-color-border-default);border-radius:var(--cui-radius-md);padding:13px var(--cui-s-5);cursor:pointer;transition:border-color .15s, box-shadow .15s;}
.histrow:hover{border-color:var(--cui-blue-300);box-shadow:var(--cui-shadow-1);}
.histrow__ic{flex:none;width:38px;height:38px;border-radius:var(--cui-radius-sm);display:flex;align-items:center;justify-content:center;font-size:16px;}
.histrow__main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.histrow__q{font-size:14.5px;font-weight:var(--cui-fw-semi);color:var(--cui-blue-900);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.histrow__hint{font-size:12.5px;color:var(--cui-gray-500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.histrow__tool{flex:none;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:var(--cui-fw-medium);color:var(--cui-gray-700);}
.histrow__dot{width:8px;height:8px;border-radius:2px;}
.histrow__time{flex:none;width:88px;text-align:right;font-size:12.5px;color:var(--cui-gray-500);}
.histrow__del{flex:none;width:30px;height:30px;border-radius:var(--cui-radius-sm);display:flex;align-items:center;justify-content:center;color:var(--cui-gray-400);font-size:14px;cursor:pointer;opacity:0;transition:opacity .15s, background .15s, color .15s;}
.histrow:hover .histrow__del,.histrow:focus-within .histrow__del{opacity:1;}
.histrow__del:hover{background:var(--cui-red-50);color:var(--cui-red-700);}
.histrow__go{flex:none;color:var(--cui-gray-300);font-size:13px;transition:transform .15s, color .15s;}
.histrow:hover .histrow__go{color:var(--cui-blue-600);transform:translateX(2px);}
.hist__empty{text-align:center;color:var(--cui-gray-500);font-size:14px;padding:48px 16px;}
.hist__empty .ico-svg{color:var(--cui-gray-400);}

@media (max-width:760px){
  .recents__row{grid-template-columns:1fr;}
  .histrow__tool{display:none;}
  .histrow__time{width:auto;}
}

/* ============================================================
   FEATURE GRID — what you get with Full Intel
   ============================================================ */
.features{margin-top:var(--cui-s-13);}
.features__head{display:flex;align-items:center;gap:var(--cui-s-4);margin-bottom:var(--cui-s-6);}
.features__head .line{flex:1;height:1px;background:var(--cui-gray-200);}
.features__head h2{font-size:13px;font-weight:var(--cui-fw-semi);text-transform:uppercase;letter-spacing:.08em;color:var(--cui-gray-500);margin:0;white-space:nowrap;}
.features__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--cui-s-7);}
.featgroup__title{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:var(--cui-fw-semi);color:var(--cui-blue-900);margin-bottom:var(--cui-s-4);}
.featgroup__title .dot{width:9px;height:9px;border-radius:3px;}
.featgroup__title .dot.value{background:var(--cui-blue-600);}
.featgroup__title .dot.site{background:var(--cui-purple-500);}
.featgroup__title .dot.pipe{background:var(--cui-teal-600);}
.featlist{display:flex;flex-direction:column;gap:2px;}
.featrow{display:flex;align-items:flex-start;gap:11px;padding:9px 8px;border-radius:var(--cui-radius-md);transition:background .14s;}
.featrow:hover{background:var(--cui-gray-50);}
.featrow__ico{flex:none;width:30px;height:30px;border-radius:var(--cui-radius-sm);background:var(--cui-gray-50);border:1px solid var(--cui-gray-200);display:flex;align-items:center;justify-content:center;color:var(--cui-gray-700);font-size:13px;margin-top:1px;}
.featrow__name{font-size:13.5px;font-weight:var(--cui-fw-semi);color:var(--cui-blue-900);display:flex;align-items:center;gap:7px;}
.featrow__name .tag{font-size:9px;font-weight:var(--cui-fw-semi);letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:var(--cui-radius-full);}
.featrow__name .tag.tier{background:var(--cui-blue-50);color:var(--cui-blue-700);}
.featrow__name .tag.soon{background:var(--cui-orange-50);color:var(--cui-orange-800);}
.featrow__desc{font-size:12px;color:var(--cui-gray-600);line-height:16px;margin-top:2px;}

.home__foot{margin-top:var(--cui-s-11);font-size:12px;color:var(--cui-gray-500);text-align:center;}

/* ============================================================
   ROUTING TRANSITION
   ============================================================ */
.routing{
  position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.72);backdrop-filter:blur(2px);animation:fadeIn .2s both;
}
.routing__card{
  display:flex;align-items:center;gap:var(--cui-s-4);
  background:var(--cui-white-000);border:1px solid var(--cui-color-border-default);
  border-radius:var(--cui-radius-lg);box-shadow:var(--cui-shadow-3);
  padding:var(--cui-s-5) var(--cui-s-7);font-size:15px;color:var(--cui-blue-900);font-weight:var(--cui-fw-medium);
}
.spinner{
  width:18px;height:18px;border-radius:50%;
  border:2.5px solid var(--cui-blue-100);border-top-color:var(--cui-blue-600);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ============================================================
   DESTINATION — Comps & Records
   ============================================================ */
.dest{display:flex;height:calc(100% - 64px);}
.dest__main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--cui-gray-50);}
.dest__chat{
  width:372px;flex:none;border-left:1px solid var(--cui-color-border-default);
  background:var(--cui-white-000);display:flex;flex-direction:column;
  animation:slideInRight .4s cubic-bezier(.22,.61,.36,1) both;
}

/* results header */
.results__head{
  display:flex;align-items:center;gap:var(--cui-s-5);
  padding:var(--cui-s-5) var(--cui-s-7);background:var(--cui-white-000);
  border-bottom:1px solid var(--cui-color-border-default);
}
.results__title{font-size:20px;font-weight:var(--cui-fw-semi);color:var(--cui-blue-900);}
.results__count{font-size:13px;color:var(--cui-gray-600);margin-top:2px;}
.results__count b{color:var(--cui-blue-600);font-weight:var(--cui-fw-semi);}

.viewtoggle{display:inline-flex;background:var(--cui-gray-100);border-radius:var(--cui-radius-md);padding:3px;gap:2px;}
.viewtoggle button{
  display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:6px;
  font-size:13px;font-weight:var(--cui-fw-medium);color:var(--cui-gray-600);transition:all .15s;
}
.viewtoggle button.active{background:var(--cui-white-000);color:var(--cui-blue-900);box-shadow:var(--cui-shadow-1);}

.sortsel{
  display:inline-flex;align-items:center;gap:8px;padding:8px 12px;
  border:1px solid var(--cui-color-border-default);border-radius:var(--cui-radius-sm);
  font-size:13px;color:var(--cui-gray-700);background:#fff;
}
.sortsel:hover{border-color:var(--cui-color-border-hover);}

/* filter chips */
.filterbar{
  display:flex;align-items:center;gap:var(--cui-s-3);flex-wrap:wrap;
  padding:var(--cui-s-4) var(--cui-s-7);background:var(--cui-white-000);
  border-bottom:1px solid var(--cui-color-border-default);
}
.filterbar__label{font-size:12px;font-weight:var(--cui-fw-semi);color:var(--cui-gray-500);text-transform:uppercase;letter-spacing:.05em;margin-right:2px;}
.fchip{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 8px 6px 12px;border-radius:var(--cui-radius-full);
  background:var(--cui-blue-50);border:1px solid var(--cui-blue-100);
  font-size:13px;color:var(--cui-blue-800);font-weight:var(--cui-fw-medium);
  animation:pop .22s ease both;
}
.fchip .k{color:var(--cui-blue-600);font-weight:var(--cui-fw-semi);}
.fchip__x{
  width:18px;height:18px;border-radius:var(--cui-radius-full);display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--cui-blue-600);transition:background .15s;
}
.fchip__x:hover{background:rgba(10,99,203,.14);}
.fchip.flash{animation:chipflash .9s ease;}
@keyframes chipflash{0%{background:var(--cui-blue-200);}100%{background:var(--cui-blue-50);}}
.fchip--add{
  background:#fff;border:1px dashed var(--cui-color-border-default);color:var(--cui-gray-600);
  padding:6px 12px;font-weight:var(--cui-fw-medium);
}
.fchip--add:hover{border-color:var(--cui-blue-300);color:var(--cui-blue-700);}

/* table */
.tablewrap{flex:1;overflow:auto;padding:var(--cui-s-5) var(--cui-s-7) var(--cui-s-9);}
.comptable{width:100%;min-width:660px;border-collapse:separate;border-spacing:0;background:#fff;
  border:1px solid var(--cui-color-border-default);border-radius:var(--cui-radius-lg);overflow:hidden;box-shadow:var(--cui-shadow-1);}
.comptable thead th{
  position:sticky;top:0;background:var(--cui-gray-50);z-index:1;
  text-align:left;font-size:11px;font-weight:var(--cui-fw-semi);letter-spacing:.04em;text-transform:uppercase;
  color:var(--cui-gray-600);padding:12px 16px;border-bottom:1px solid var(--cui-color-border-default);white-space:nowrap;
}
.comptable thead th.num{text-align:right;}
.comptable tbody tr{cursor:pointer;transition:background .12s;}
.comptable tbody tr:hover{background:var(--cui-blue-50);}
.comptable tbody td{padding:14px 16px;border-bottom:1px solid var(--cui-gray-100);font-size:14px;color:var(--cui-blue-900);vertical-align:middle;}
.comptable tbody tr:last-child td{border-bottom:none;}
.comptable td.num{text-align:right;font-variant-numeric:tabular-nums;}
.comptable .addr{font-weight:var(--cui-fw-semi);white-space:nowrap;}
.comptable .addr .sub{display:block;font-weight:var(--cui-fw-regular);font-size:12px;color:var(--cui-gray-500);margin-top:2px;white-space:nowrap;}
.comptable .price{font-weight:var(--cui-fw-semi);}
.rowin{animation:fadeUp .35s ease both;}

.typepill{
  display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--cui-radius-full);
  font-size:12px;font-weight:var(--cui-fw-semi);
}
.typepill.retail{background:var(--cui-blue-50);color:var(--cui-blue-700);}
.typepill.industrial{background:var(--cui-orange-50);color:var(--cui-orange-800);}
.typepill.multifamily{background:var(--cui-purple-50);color:var(--cui-purple-700);}
.typepill.office{background:var(--cui-teal-50);color:var(--cui-teal-900);}

.caprate{font-weight:var(--cui-fw-semi);}
.caprate.hi{color:var(--cui-green-800);}

.emptyrows{padding:48px 16px;text-align:center;color:var(--cui-gray-500);font-size:14px;}

/* map view */
.mapview{flex:1;position:relative;overflow:hidden;margin:var(--cui-s-5) var(--cui-s-7) var(--cui-s-9);border-radius:var(--cui-radius-lg);border:1px solid var(--cui-color-border-default);box-shadow:var(--cui-shadow-1);}
.mapview__canvas{position:absolute;inset:0;background:
  linear-gradient(0deg, rgba(72,172,173,.05), rgba(72,172,173,.05)),
  repeating-linear-gradient(56deg,#eef1f4 0 38px,#e9edf1 38px 39px),
  repeating-linear-gradient(-34deg,#eef1f4 0 52px,#e9edf1 52px 53px),
  #eef1f4;}
.mapview__road{position:absolute;background:#fff;opacity:.9;}
.mappin{
  position:absolute;transform:translate(-50%,-100%);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;z-index:2;
}
.mappin__price{
  background:var(--cui-blue-600);color:#fff;font-size:12px;font-weight:var(--cui-fw-semi);
  padding:4px 9px;border-radius:var(--cui-radius-full);white-space:nowrap;box-shadow:var(--cui-shadow-2);
  border:1.5px solid #fff;transition:transform .12s, background .15s;
}
.mappin__tip{width:2px;height:7px;background:var(--cui-blue-600);}
.mappin:hover{z-index:5;}
.mappin:hover .mappin__price{transform:scale(1.08);background:var(--cui-blue-700);}
.mappin.active .mappin__price{background:var(--cui-purple-600);}
.mappin.active .mappin__tip{background:var(--cui-purple-600);}
.maphint{position:absolute;left:16px;bottom:16px;z-index:3;background:rgba(255,255,255,.92);border:1px solid var(--cui-color-border-default);border-radius:var(--cui-radius-md);padding:8px 12px;font-size:12px;color:var(--cui-gray-600);box-shadow:var(--cui-shadow-1);}

/* ============================================================
   DOCKED CHAT
   ============================================================ */
.chat__head{padding:var(--cui-s-5) var(--cui-s-5) var(--cui-s-4);border-bottom:1px solid var(--cui-color-border-default);}
.chat__prefs{width:28px;height:28px;border-radius:var(--cui-radius-sm);display:flex;align-items:center;justify-content:center;color:var(--cui-gray-500);font-size:13px;background:none;border:none;cursor:pointer;transition:background .15s, color .15s;}
.chat__prefs:hover{background:var(--cui-interaction-default-hovered);color:var(--cui-blue-700);}
.chat__who{display:flex;align-items:center;gap:var(--cui-s-3);}
.chat__avatar{
  width:32px;height:32px;border-radius:var(--cui-radius-md);background:var(--cui-intel-gradient);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex:none;
}
.chat__who h4{font-size:14px;font-weight:var(--cui-fw-semi);margin:0;color:var(--cui-blue-900);}
.chat__who .role{font-size:11.5px;color:var(--cui-gray-500);margin-top:1px;}
.chat__who .live{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--cui-green-800);font-weight:var(--cui-fw-medium);}
.chat__who .live .d{width:7px;height:7px;border-radius:50%;background:var(--cui-green-600);}

.chat__body{flex:1;overflow:auto;padding:var(--cui-s-5);display:flex;flex-direction:column;gap:var(--cui-s-4);}
.msg{display:flex;gap:10px;max-width:100%;animation:fadeUp .3s ease both;}
.msg__av{width:26px;height:26px;border-radius:var(--cui-radius-sm);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;}
.msg__av.ai{background:var(--cui-intel-gradient);color:#fff;}
.msg__av.me{background:var(--cui-blue-700);color:#fff;font-weight:var(--cui-fw-semi);}
.msg__bubble{font-size:13.5px;line-height:20px;border-radius:var(--cui-radius-md);padding:10px 13px;}
.msg.ai .msg__bubble{background:var(--cui-gray-50);color:var(--cui-blue-900);border:1px solid var(--cui-gray-100);}
.msg.me{flex-direction:row-reverse;}
.msg.me .msg__bubble{background:var(--cui-blue-600);color:#fff;}
.msg__bubble b{font-weight:var(--cui-fw-semi);}
.msg.ai .msg__bubble .pill{display:inline-block;background:var(--cui-blue-50);color:var(--cui-blue-700);border-radius:var(--cui-radius-sm);padding:0 5px;font-size:12.5px;font-weight:var(--cui-fw-semi);}

.typing{display:flex;gap:4px;padding:4px 2px;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--cui-gray-400);animation:blink 1.2s infinite both;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0);}40%{opacity:1;transform:translateY(-2px);}}

.chat__sugg{padding:0 var(--cui-s-5) var(--cui-s-4);display:flex;flex-wrap:wrap;gap:7px;}
.chat__sugg button{
  font-size:12px;color:var(--cui-blue-700);background:var(--cui-blue-50);border:1px solid var(--cui-blue-100);
  border-radius:var(--cui-radius-full);padding:6px 11px;transition:background .15s;font-weight:var(--cui-fw-medium);
}
.chat__sugg button:hover{background:var(--cui-blue-100);}

.chat__input{padding:var(--cui-s-4);border-top:1px solid var(--cui-color-border-default);}
.chat__inputrow{
  display:flex;align-items:flex-end;gap:8px;border:1.5px solid var(--cui-color-border-default);
  border-radius:var(--cui-radius-md);padding:8px 8px 8px 12px;transition:border-color .15s, box-shadow .15s;
}
.chat__inputrow:focus-within{border-color:var(--cui-color-border-active);box-shadow:0 0 0 3px var(--cui-blue-50);}
.chat__inputrow textarea{flex:1;border:none;outline:none;resize:none;font-size:13.5px;line-height:19px;max-height:90px;color:var(--cui-blue-900);background:transparent;}
.chat__inputrow textarea::placeholder{color:var(--cui-gray-500);}
.chat__inputrow button{flex:none;width:32px;height:32px;border-radius:var(--cui-radius-sm);background:var(--cui-blue-600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;transition:background .15s;}
.chat__inputrow button:hover{background:var(--cui-blue-700);}
.chat__inputrow button:disabled{background:var(--cui-gray-200);color:var(--cui-gray-400);}

/* ============================================================
   PDP DRILL-DOWN
   ============================================================ */
.pdp__scrim{position:fixed;inset:0;background:var(--cui-color-surface-backdrop);z-index:70;animation:fadeIn .2s both;}
.pdp{
  position:fixed;top:0;right:0;bottom:0;width:560px;max-width:92vw;z-index:71;
  background:var(--cui-white-000);box-shadow:var(--cui-shadow-4);
  display:flex;flex-direction:column;animation:slideInRight .32s cubic-bezier(.22,.61,.36,1) both;
}
.pdp__hero{height:220px;position:relative;flex:none;background:
  linear-gradient(180deg, rgba(6,34,57,0) 40%, rgba(6,34,57,.55) 100%),
  repeating-linear-gradient(45deg,#9fb2c4 0 22px,#94a8ba 22px 44px);}
.pdp__close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:var(--cui-radius-full);background:rgba(255,255,255,.92);color:var(--cui-blue-900);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:var(--cui-shadow-2);}
.pdp__close:hover{background:#fff;}
.pdp__heroinfo{position:absolute;left:24px;bottom:18px;right:24px;color:#fff;}
.pdp__heroinfo .t{font-size:22px;font-weight:var(--cui-fw-semi);letter-spacing:-.01em;}
.pdp__heroinfo .s{font-size:13px;opacity:.9;margin-top:3px;}
.pdp__body{flex:1;overflow:auto;padding:var(--cui-s-7);}
.pdp__price{display:flex;align-items:baseline;gap:var(--cui-s-4);margin-bottom:var(--cui-s-6);}
.pdp__price .big{font-size:30px;font-weight:var(--cui-fw-semi);color:var(--cui-blue-900);letter-spacing:-.01em;}
.pdp__price .psf{font-size:14px;color:var(--cui-gray-600);}
.pdp__grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--cui-gray-200);border:1px solid var(--cui-gray-200);border-radius:var(--cui-radius-lg);overflow:hidden;margin-bottom:var(--cui-s-7);}
.pdp__cell{background:#fff;padding:var(--cui-s-5);}

.ob-mchip button{width:18px;height:18px;border-radius:99px;border:none;background:none;color:var(--cui-blue-600);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;}
.ob-mchip button:hover{background:rgba(10,99,203,.14);}
.ob-textarea{width:100%;min-height:120px;border:1.5px solid var(--cui-gray-300);border-radius:var(--cui-radius-md);padding:14px;font-family:var(--cui-font-sans);font-size:15px;line-height:1.5;color:var(--cui-blue-900);resize:vertical;}
.ob-textarea:focus{outline:none;border-color:var(--cui-blue-600);box-shadow:0 0 0 3px var(--cui-blue-50);}

.ob-nav{display:flex;align-items:center;justify-content:space-between;padding:var(--cui-s-5) var(--cui-s-8);border-top:1px solid var(--cui-gray-200);background:var(--cui-gray-50);}
.ob-nav-right{display:flex;align-items:center;gap:var(--cui-s-3);}

/* summary */
.ob-summary{padding:var(--cui-s-9) var(--cui-s-8) var(--cui-s-7);}
.ob-done-badge{width:54px;height:54px;border-radius:var(--cui-radius-full);background:var(--cui-green-50);color:var(--cui-green-700);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto var(--cui-s-5);}
.ob-summary .ob-h1,.ob-summary .ob-lede{text-align:center;}
.ob-recap{border:1px solid var(--cui-gray-200);border-radius:var(--cui-radius-md);overflow:hidden;margin:var(--cui-s-7) 0 var(--cui-s-5);}
.ob-recap-row{display:flex;gap:var(--cui-s-5);padding:11px var(--cui-s-5);border-bottom:1px solid var(--cui-gray-100);}
.ob-recap-row:last-child{border-bottom:none;}
.ob-recap-k{flex:none;width:140px;font-size:12.5px;font-weight:var(--cui-fw-semi);color:var(--cui-gray-500);text-transform:uppercase;letter-spacing:.03em;}
.ob-recap-v{font-size:14px;color:var(--cui-blue-900);font-weight:var(--cui-fw-medium);}
.ob-recap-v.skipped{color:var(--cui-gray-400);font-style:italic;font-weight:var(--cui-fw-regular);}
.ob-ctx-toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:var(--cui-fw-medium);color:var(--cui-blue-600);background:none;border:none;cursor:pointer;padding:4px 0;}
.ob-ctx{position:relative;margin-top:var(--cui-s-4);background:var(--cui-blue-900);border-radius:var(--cui-radius-md);padding:var(--cui-s-5);}
.ob-ctx pre{margin:0;font-family:var(--cui-font-mono);font-size:12px;line-height:1.6;color:var(--cui-blue-100);white-space:pre-wrap;}
.ob-ctx-copy{position:absolute;top:10px;right:10px;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:var(--cui-fw-semi);color:#fff;background:rgba(255,255,255,.14);border:none;border-radius:var(--cui-radius-sm);padding:6px 10px;cursor:pointer;}
.ob-ctx-copy:hover{background:rgba(255,255,255,.24);}
.ob-summary-actions{display:flex;justify-content:flex-end;gap:var(--cui-s-3);margin-top:var(--cui-s-7);}

/* ============================================================
   IN-CHAT EMBEDDED ONBOARDING
   ============================================================ */
.console{position:relative;width:100%;max-width:680px;margin:0 auto;}
.console-glow{display:none;}
.console-inner{position:relative;z-index:1;background:#fff;border:1px solid var(--cui-gray-200);border-radius:var(--cui-radius-lg);box-shadow:var(--cui-shadow-1);overflow:hidden;display:flex;flex-direction:column;max-height:min(72vh,640px);}
.console-head{display:flex;align-items:center;gap:var(--cui-s-4);padding:var(--cui-s-5) var(--cui-s-6);border-bottom:1px solid var(--cui-gray-100);}
.console-av{width:34px;height:34px;border-radius:var(--cui-radius-md);background:var(--cui-intel-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;}
.console-id h4{margin:0;font-size:14.5px;font-weight:var(--cui-fw-semi);color:var(--cui-blue-900);}
.console-id .r{font-size:12px;color:var(--cui-gray-500);margin-top:1px;}
.console-mini{margin-left:auto;display:flex;align-items:center;gap:9px;}
.console-mini .bar{width:70px;height:5px;border-radius:99px;background:var(--cui-gray-100);overflow:hidden;}
.console-mini .bar span{display:block;height:100%;background:var(--cui-intel-gradient);transition:width .35s ease;}
.console-mini .pc{font-size:11px;font-weight:var(--cui-fw-semi);color:var(--cui-gray-500);}

.obchat{flex:1;overflow:auto;padding:var(--cui-s-6);display:flex;flex-direction:column;gap:var(--cui-s-4);}
.obc-row{display:flex;gap:10px;animation:fadeUp .3s ease both;}
.obc-row.me{flex-direction:row-reverse;}
.obc-av{flex:none;width:28px;height:28px;border-radius:var(--cui-radius-sm);display:flex;align-items:center;justify-content:center;font-size:12px;}
.obc-av.ai{background:var(--cui-intel-gradient);color:#fff;}
.obc-av.me{background:var(--cui-blue-700);color:#fff;font-size:11px;font-weight:var(--cui-fw-semi);}
.obc-bubble{font-size:14px;line-height:1.5;border-radius:var(--cui-radius-md);padding:11px 14px;max-width:80%;}
.obc-row.ai .obc-bubble{background:var(--cui-gray-50);border:1px solid var(--cui-gray-100);color:var(--cui-blue-900);}
.obc-row.me .obc-bubble{background:var(--cui-blue-600);color:#fff;font-weight:var(--cui-fw-medium);}
.obc-bubble b{font-weight:var(--cui-fw-semi);}

/* the interactive question card embedded in the conversation */
.obc-card{align-self:stretch;border:1px solid var(--cui-gray-200);background:#fff;border-radius:var(--cui-radius-lg);padding:var(--cui-s-5);animation:fadeUp .3s ease both;}
.obc-card-q{font-size:15px;font-weight:var(--cui-fw-semi);color:var(--cui-blue-900);}
.obc-card-sub{font-size:12.5px;color:var(--cui-gray-600);margin:4px 0 var(--cui-s-4);}
.obc-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.obc-opts.one{grid-template-columns:1fr;}
.obc-card .ob-card{padding:10px 13px;}
.obc-card .ob-card-t{font-size:13.5px;}
.obc-card .ob-card-d{font-size:12px;}
.obc-actions{display:flex;align-items:center;gap:var(--cui-s-3);margin-top:var(--cui-s-4);}
.obc-actions .grow{flex:1;}
.obc-continue{display:inline-flex;align-items:center;gap:8px;background:var(--cui-blue-600);color:#fff;border:none;border-radius:var(--cui-radius-sm);font-size:13.5px;font-weight:var(--cui-fw-semi);padding:9px 16px;cursor:pointer;transition:background .15s;}
.obc-continue:hover{background:var(--cui-blue-700);}
.obc-continue:disabled{background:var(--cui-gray-200);color:var(--cui-gray-400);cursor:default;}
.obc-skip{font-size:12.5px;color:var(--cui-gray-500);background:none;border:none;cursor:pointer;}
.obc-skip:hover{color:var(--cui-blue-700);}

/* footer input of the console */
.console-foot{border-top:1px solid var(--cui-gray-100);padding:var(--cui-s-4);}

.console-inputrow.ready:focus-within{border-color:var(--cui-blue-600);box-shadow:0 0 0 3px var(--cui-blue-50);}
.console-inputrow.locked{background:var(--cui-gray-50);border-style:dashed;}
.console-inputrow .ico-svg{color:var(--cui-purple-500);}
.console-inputrow input{flex:1;border:none;outline:none;background:transparent;font-size:14.5px;color:var(--cui-blue-900);}
.console-inputrow input:disabled{cursor:not-allowed;}
.console-send{flex:none;width:36px;height:36px;border-radius:var(--cui-radius-sm);background:var(--cui-intel-gradient);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:filter .15s;}

.console-ready-row button:hover{background:var(--cui-blue-100);}

/* ============================================================
   PLANNING CONSOLE — reasoning steps + plan card
   ============================================================ */
.plan-steps{display:flex;flex-direction:column;gap:11px;}
.plan-step{display:flex;align-items:center;gap:11px;font-size:13.5px;color:var(--cui-gray-500);animation:fadeUp .28s ease both;}

.plan-step.done{color:var(--cui-blue-900);font-weight:var(--cui-fw-medium);}
.plan-step.done .pin{background:var(--cui-green-50);color:var(--cui-green-700);}
.plan-step.active{color:var(--cui-blue-800);font-weight:var(--cui-fw-medium);}
.plan-step.active .pin{background:var(--cui-blue-50);}
.plan-spin{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--cui-blue-100);border-top-color:var(--cui-blue-600);animation:spin .7s linear infinite;}

.plancard__badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:var(--cui-fw-semi);text-transform:uppercase;letter-spacing:.04em;color:var(--cui-blue-700);background:var(--cui-blue-50);border:1px solid var(--cui-blue-100);border-radius:var(--cui-radius-full);padding:4px 11px;}
.plancard p{font-size:14px;line-height:1.55;color:var(--cui-blue-900);margin:0 0 var(--cui-s-5);}
.plan-cta{display:flex;gap:10px;}
.plan-cta .ob-btn{padding:10px 16px;font-size:14px;}

  .modebar{flex-wrap:wrap;}
  .modebar__note{display:none;}

window.personalizeHome = function(profile){
  const a = profile || {};
  const hasProfile = !!(a.role || (a.uses && a.uses.length));
  if (!hasProfile){
    return { personalized:false, prompts:HOME_PROMPTS, cards:CAP_CARDS, primaryKey:null, focusLabel:null, role:null };
  }

  // active jobs in priority order: explicit uses first, else role-inferred
  let jobs = [];
  (a.uses || []).forEach(u => { const j = JOB_FROM_USE[u]; if (j && !jobs.includes(j)) jobs.push(j); });
  if (jobs.length === 0 && a.role && ROLE_JOBS[a.role]) jobs = ROLE_JOBS[a.role].slice();
  if (jobs.length === 0) jobs = ['valuation','site','bizdev'];

  // tokens from asset focus + markets
  const assets = (a.assets || []).filter(x => x && !/^all/i.test(x));
  const al = (assets[0] || 'commercial').toLowerCase();
  const firstMarket = (!a.nationwide && a.markets && a.markets.length) ? a.markets[0] : null;
  const m = firstMarket || (a.nationwide ? 'any market' : 'your markets');
  const fill = (s) => s.replace(/\{al\}/g, al).replace(/\{m\}/g, m);

  // prompts: fixed suggested set across all roles (round-robin bank disabled)
  const prompts = HOME_PROMPTS.slice();

  // card order: job-mapped cards first, then the rest
  const order = [];
  jobs.forEach(j => { const k = JOB_CARD[j]; if (k && !order.includes(k)) order.push(k); });
  ['value','site','pipe'].forEach(k => { if (!order.includes(k)) order.push(k); });
  const cards = order.map(k => CAP_CARDS.find(c => c.key === k)).filter(Boolean);

  return {
    personalized: true,
    prompts,
    cards,
    primaryKey: cards.length ? cards[0].key : null,
    focusLabel: JOB_LABEL[jobs[0]] || null,
    role: a.role || null,
  };
};

/* ---------------------------------------------------------------

   The router stays "thin": it picks the destination + light signals,
   the destination (sub-agent) owns the experience.
   --------------------------------------------------------------- */
window.routeQuery = function(textRaw){
  const t = (textRaw || '').toLowerCase();
  const has = (...w) => w.some(x => t.includes(x));

  // axis 1 — live marketplace beats everything (active sale/lease)
  if (has('for lease','for sale','available to lease','available to buy','on market','on the market','listing','listings','space available','available space','lease right now','buy right now') ||
      (has('available','lease') && !has('comp'))) {
    return { dest:'market', agent:'listing_search', specialist:'Marketplace specialist', role:'Live for-sale & for-lease',
      ack:"Opening the live marketplace.",
      handoff:"Here's <b>active for-sale &amp; for-lease inventory</b> matching your search. Toggle sale vs. lease, or refine by type — I'll keep the list live.",
      listingMode:(has('sale','buy','acquire') && !has('lease')) ? 'For Sale' : (has('lease') ? 'For Lease' : 'all') };
  }

  // site expansion / map — market screening OR just viewing an overlay
  if (has('site','sites','where should','where to','expand','expansion','screen','overlay','zoning','zoned','parcel','traffic','demographic','flood','fire risk','poi','rents','logistics hub','build a','build out','develop','redevelop','ground-up','best area','market for','map')) {
    // which overlays were named?
    let ov = [];
    OVERLAYS.forEach(o => {
      if (t.includes(o.id) || t.includes(o.label.toLowerCase()) ||
          (o.id==='zoning' && (t.includes('zoned')||t.includes('parcel'))) ||
          (o.id==='flood' && (t.includes('flood')||t.includes('fire'))) ||
          (o.id==='demo' && t.includes('demograph')) ||
          (o.id==='poi' && t.includes('anchor'))) ov.push(o.id);
    });
    if (ov.length === 0) ov = ['zoning'];
    // "see/show/view the map / a layer" with no site-hunting language = just open the map
    const viewOnly = has('see','show','view','look at','open','pull up','display','bring up','what is','whats','zoned','parcel') &&
                     !has('site','sites','expand','expansion','screen','acquire','where should','where to','develop','redevelop','build a','build out','best area');
    const ovLabel = OVERLAYS.filter(o => ov.includes(o.id)).map(o => o.label).join(', ');
    return { dest:'map', agent:'site_expansion', specialist:'Site specialist',
      role: viewOnly ? 'Map · overlays' : 'Market screening · overlays',
      ack: viewOnly ? "Opening the map." : "Got it — screening the market.",
      handoff: viewOnly
        ? `Here's the <b>${ovLabel} overlay</b> on the map. Toggle other layers anytime — or ask me to screen the area for candidate sites.`
        : "I dropped you into <b>Map Explorer</b> with candidate sites plotted. Layer on overlays — zoning, traffic, demographics, risk — and I'll re-rank as you go. No single layer is the gate.",
      overlays: ov, sites: !viewOnly };
  }

  // business development — owners / prospecting / skiptrace / alerts
  if (has('own','owner','reach','contact','skip trace','skiptrace','prospect','off-market','off market','pipeline','alert','enrich','decision-maker','decision maker','llc','likely to sell','likely to list','going to sell','sell soon','propensity','motivated seller','predictive')) {
    return { dest:'bizdev', agent:'business_development', specialist:'Pipeline specialist', role:'Owners & outreach',
      ack:"On it — let's find owners and a way to reach them.",
      handoff:"Here are <b>owner records</b> matching your search. Hit <b>Skip trace</b> on any to resolve the LLC to a real person, or save this as a standing alert." };
  }

  // valuation — wants a number
  if (has('worth','value','valuation','bov','underwrite','appraise','how should i price','what should i ask','price it')) {
    return { dest:'comps', agent:'valuation', specialist:'Valuation specialist', role:'Pricing & BOV',
      ack:"Let's build a defensible number.",
      handoff:"I pulled <b>recent comparable sales</b> to anchor a valuation. Narrow by date, cap rate or size below — or ask me to build a BOV.",
      filters:[{id:'asset',k:'Asset',v:'Retail'},{id:'market',k:'Market',v:'Los Angeles'},{id:'date',k:'Sale date',v:'Last 12 mo'}], view:'list', valuation:true };
  }

  // default — aggregate search (comps / records list)
  let filters = [{id:'asset',k:'Asset',v:'Retail'},{id:'market',k:'Market',v:'Los Angeles'},{id:'date',k:'Sale date',v:'Last 12 mo'}];
  let role = 'Sale comps · LA';
  if (has('industrial')) filters = [{id:'asset',k:'Asset',v:'Industrial'},{id:'market',k:'Market',v:'Los Angeles'}];
  else if (has('multifamily','apartment')) { filters = [{id:'asset',k:'Asset',v:'Multifamily'},{id:'market',k:'Market',v:'Los Angeles'}]; }
  return { dest:'comps', agent:'aggregate_search', specialist:'Comps specialist', role,
    ack:"On it — pulling comparable sales.",
    handoff:"I pulled <b>retail sales in Los Angeles from the last 12 months</b>. Refine anything below, or ask me to narrow it.",
    filters, view:'list' };
};

window.refineQuery = function(textRaw){
  const t = (textRaw || '').toLowerCase();
  const ops = []; let reply = null;
  if ((/\b(6|six)\b/.test(t) && t.includes('month')) || t.includes('last 6') || t.includes('past 6')) {
    ops.push({type:'setFilter',payload:{id:'date',k:'Sale date',v:'Last 6 mo'}});
    reply = "Done — narrowed to the <span class='pill'>last 6 months</span>. Showing {COUNT} records.";
  } else if (t.includes('last 3') || (/\b(3|three)\b/.test(t) && t.includes('month'))) {
    ops.push({type:'setFilter',payload:{id:'date',k:'Sale date',v:'Last 3 mo'}});
    reply = "Tightened to the <span class='pill'>last 3 months</span> — {COUNT} records.";
  }
  if (t.includes('cap')) {
    const m = t.match(/(\d(?:\.\d)?)\s*%?/); const v = m ? parseFloat(m[1]) : 6;
    ops.push({type:'addFilter',payload:{id:'cap',k:'Cap rate',v:'> '+v.toFixed(1)+'%',min:v}});
    reply = (reply?reply+" ":"") + `Added a <span class='pill'>cap rate &gt; ${v.toFixed(1)}%</span> filter — {COUNT} records.`;
  }
  if (t.includes('psf') || t.includes('/sf') || t.includes('per sf') || t.includes('per square')) {
    const m = t.match(/\$?\s?(\d{2,4})/); const v = m ? parseInt(m[1],10) : 700;
    ops.push({type:'addFilter',payload:{id:'psf',k:'$/SF',v:'< $'+v,max:v}});
    reply = (reply?reply+" ":"") + `Capped at <span class='pill'>under $${v}/SF</span> — {COUNT} records.`;
  }
  if (t.includes('map')) { ops.push({type:'setView',payload:'map'}); reply = reply || "Switched to the map view — pins reflect your current filters."; }
  else if (t.includes('list') || t.includes('table')) { ops.push({type:'setView',payload:'list'}); reply = reply || "Back to the list view."; }
  if (t.includes('industrial')) { ops.push({type:'setFilter',payload:{id:'asset',k:'Asset',v:'Industrial'}}); reply = reply || "Switched the asset type to <span class='pill'>Industrial</span> — {COUNT} records."; }
  else if (t.includes('multifamily') || t.includes('apartment')) { ops.push({type:'setFilter',payload:{id:'asset',k:'Asset',v:'Multifamily'}}); reply = reply || "Switched to <span class='pill'>Multifamily</span> — {COUNT} records."; }
  if (ops.length === 0) reply = "I can refine these — try \u201cnarrow to the last 6 months,\u201d \u201conly over 6% cap rate,\u201d \u201cunder $700/SF,\u201d or \u201cshow me the map.\u201d";
  return { reply, ops };
};

window.applyFilters = function(comps, filters){
  return comps.filter(c => {
    for (const f of filters){
      if (f.id === 'asset' && c.type !== f.v) return false;
      if (f.id === 'market'){
        const m = f.v.toLowerCase();
        if (m.includes('los angeles') && !/(los angeles|beverly|vernon)/.test(c.city.toLowerCase())) return false;
      }
      if (f.id === 'date'){ const max = f.v.includes('3')?3:f.v.includes('6')?6:12; if (c.monthsAgo > max) return false; }
      if (f.id === 'cap' && typeof f.min === 'number' && c.cap <= f.min) return false;
      if (f.id === 'psf' && typeof f.max === 'number' && c.psf >= f.max) return false;
    }
    return true;
  });
};

   "working" steps to show while it reasons. Drives the confirm step.
   --------------------------------------------------------------- */
window.buildPlan = function(route){
  const dest = route.dest;
  if (dest === 'comps'){
    const summary = (route.filters || []).map(x => x.v).join(' · ');
    return {
      tool: 'Search Aggregate',
      steps: ['Reading your request', 'Classifying intent \u2192 comparable sales', 'Opening Search Aggregate', 'Pre-setting filters' + (summary ? ': ' + summary : '')],
      plan: `I'll open <b>Search Aggregate</b> (Comps &amp; Records) and filter down to <b>${summary || 'your criteria'}</b>. You can refine any of it once we're there.`,
    };
  }
  if (dest === 'map'){
    const ov = (route.overlays || []).map(id => (OVERLAYS.find(o => o.id === id) || {}).label).filter(Boolean);
    const ovTxt = ov.length ? ov.join(' &amp; ') + ' overlay' + (ov.length > 1 ? 's' : '') : 'base map';
    const withSites = route.sites !== false;
    return {
      tool: 'Map Explorer',
      steps: ['Reading your request', 'Classifying intent \u2192 ' + (withSites ? 'site screening' : 'map view'), 'Opening Map Explorer', 'Layering the ' + ov.join(' & ') + (withSites ? ' + ranking sites' : ' overlay')],
      plan: `I'll drop you into <b>Map Explorer</b> with the <b>${ovTxt}</b>${withSites ? ' and ranked candidate sites' : ''}. Add or remove layers anytime.`,
    };
  }
  if (dest === 'bizdev'){
    return {
      tool: 'Owners & Outreach',
      steps: ['Reading your request', 'Classifying intent \u2192 prospecting / ownership', 'Opening Owners & Outreach', 'Matching owner records'],
      plan: `I'll open <b>Owners &amp; Outreach</b> with matching owner records, so you can skip-trace the LLC to a real decision-maker and reach them.`,
    };
  }
  if (dest === 'market'){
    const mode = route.listingMode && route.listingMode !== 'all' ? route.listingMode.toLowerCase() : 'all active';
    return {
      tool: 'Marketplace',
      steps: ['Reading your request', 'Classifying intent \u2192 live listings', 'Opening Marketplace Search', 'Filtering to ' + mode + ' inventory'],
      plan: `I'll open the <b>Marketplace</b> and show <b>${mode}</b> inventory matching your search. Toggle sale vs. lease anytime.`,
    };
  }
  return { tool: 'Intelligence', steps: ['Reading your request', 'Routing'], plan: "I'll take you to the right place." };
};

   CHAT HISTORY — past sessions. Each reopens by re-routing its query.
   `hAgo` = hours ago relative to now, used to bucket Today/Week/Earlier.
   --------------------------------------------------------------- */
