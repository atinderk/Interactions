window.relTime = function(hAgo){
  if (hAgo < 1) return 'Just now';
  if (hAgo < 24) return hAgo + 'h ago';
  const d = Math.round(hAgo / 24);
  if (d === 1) return 'Yesterday';
  if (d < 7) return d + ' days ago';
  if (d < 14) return 'Last week';
  const wk = Math.round(d / 7);
  if (d < 30) return wk + ' weeks ago';
  const mo = Math.round(d / 30);
  return mo === 1 ? 'Last month' : mo + ' months ago';
};

window.sessionBucket = function(hAgo){
  if (hAgo < 24) return 'today';
  if (hAgo < 24 * 7) return 'week';
  return 'earlier';
};
window.BUCKET_LABEL = { today:'Today', week:'This week', earlier:'Earlier' };

/* dismissed sessions persist so removed conversations stay gone on reload */
window.SESSION_DISMISS_KEY = 'crexi_intel_dismissed_sessions_v1';
window.loadSessions = function(){
  let dismissed = [];
  try { dismissed = JSON.parse(localStorage.getItem(SESSION_DISMISS_KEY) || '[]'); } catch (e) {}
  return SESSIONS.filter(s => !dismissed.includes(s.id));
};
window.persistDismiss = function(id){
  let d = [];
  try { d = JSON.parse(localStorage.getItem(SESSION_DISMISS_KEY) || '[]'); } catch (e) {}
  if (!d.includes(id)) d.push(id);
  try { localStorage.setItem(SESSION_DISMISS_KEY, JSON.stringify(d)); } catch (e) {}
};

  catch (e) { return obBlankAnswers(); }
};
window.obSaveProfile = function(a, done){
  try { localStorage.setItem(OB_PROFILE_KEY, JSON.stringify(a)); if (done) localStorage.setItem(OB_DONE_KEY, "1"); } catch (e) {}
};

window.obBuildContext = function(a){
  const line = (label, val) => label + ": " + (val && val.length ? val : "—");
  return [
    "# Crexi Intelligence — user profile",
    line("Role", a.role),
    line("Primary uses", (a.uses || []).join(", ")),
    line("Asset focus", (a.assets || []).join(", ")),
    line("Markets", a.nationwide ? "Nationwide" : (a.markets || []).join(", ")),
    line("Typical deal size", a.deal),
    line("Response style", a.response),
    line("Notes", a.notes),
  ].join("\n");
};

// one-line summary for the chat-context chip
window.obProfileSummary = function(a){
  const bits = [];
  if (a.role) bits.push(a.role);
  if (a.assets && a.assets.length) bits.push(a.assets.slice(0,2).join(" / ") + (a.assets.length>2 ? " +"+(a.assets.length-2) : ""));
  if (a.nationwide) bits.push("Nationwide");
  else if (a.markets && a.markets.length) bits.push(a.markets.slice(0,2).join(", ") + (a.markets.length>2 ? " +"+(a.markets.length-2) : ""));
  if (a.response) bits.push(a.response);
  return bits.join(" · ");
};

<script type="text/babel" data-src="components.jsx">
/* ============================================================
   Shared components — Icon, TopBar, ChatThread, DockInput,
   ChatPanel, FilterChip, DestShell
   Exposed on window for the other babel scripts.
   ============================================================ */
const { useState, useEffect, useRef } = React;

function Icon({ name, solid, style }){
  const inner = (window.ICONS && (window.ICONS[name] || window.ICONS._fallback)) || '';
  return (
    <svg className="ico-svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none"
      stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"
      style={style} aria-hidden="true" dangerouslySetInnerHTML={{ __html: inner }} />
  );
}

function TopBar({ crumb, onHome, onPrefs, onHistory, historyActive }){
  const navItems = ['Sale', 'Lease', 'Auctions', 'Comps & Records'];
  return (
    <header className="appbar">
      <button className="appbar__menu" title="Menu"><Icon name="bars" /></button>
      <button className="appbar__brand" onClick={onHome} title="Crexi home" style={{cursor:'pointer'}}>
        <img className="appbar__logo" src="assets/crexi-wordmark.svg" alt="Crexi" />
      </button>
      <nav className="appbar__nav">
        {navItems.map(it => <a key={it} className="appbar__navlink" href="#">{it}</a>)}
        <span className="appbar__navsep"></span>
        <a className="appbar__navlink" href="#">Products</a>
        <a className="appbar__navlink is-active" href="#" onClick={(e)=>{e.preventDefault(); onHome && onHome();}}>AI</a>
      </nav>
      <span className="appbar__spacer"></span>
      <a className="appbar__action" href="#">Add Listing</a>
      {onHistory && <button className={'iconbtn' + (historyActive ? ' active' : '')} title="Chat history" onClick={onHistory}><Icon name="history" /></button>}
      {onPrefs && <button className="iconbtn" title="Your preferences" onClick={onPrefs}><Icon name="sliders" /></button>}
      <button className="iconbtn" title="More"><Icon name="ellipsis-vertical" /></button>
      <div className="avatar" title="Dana Okafor">DO</div>
    </header>
  );
}

function Message({ m }){
  if (m.typing){
    return (
      <div className="msg ai">
        <div className="msg__av ai"><Icon name="sparkles" solid /></div>
        <div className="msg__bubble"><div className="typing"><span></span><span></span><span></span></div></div>
      </div>
    );
  }
  const isMe = m.from === 'me';
  return (
    <div className={'msg ' + (isMe ? 'me' : 'ai')}>
      <div className={'msg__av ' + (isMe ? 'me' : 'ai')}>{isMe ? 'DO' : <Icon name="sparkles" solid />}</div>
      <div className="msg__bubble" dangerouslySetInnerHTML={{ __html: m.text }} />
    </div>
  );
}

function ChatThread({ messages }){
  const ref = useRef(null);
  useEffect(() => { if (ref.current) ref.current.scrollTop = ref.current.scrollHeight; }, [messages]);
  return (
    <div className="chat__body" ref={ref}>
      {messages.map((m, i) => <Message key={i} m={m} />)}
    </div>
  );
}

function DockInput({ onSend, placeholder }){
  const [val, setVal] = useState('');
  const taRef = useRef(null);
  const grow = (el) => { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 90) + 'px'; };
  const submit = () => { const v = val.trim(); if (!v) return; onSend(v); setVal(''); if (taRef.current) taRef.current.style.height = 'auto'; };
  return (
    <div className="chat__input">
      <div className="chat__inputrow">
        <textarea ref={taRef} rows={1} value={val} placeholder={placeholder || 'Refine these results…'}
          onChange={(e) => { setVal(e.target.value); grow(e.target); }}
          onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submit(); } }} />
        <button onClick={submit} disabled={!val.trim()} title="Send"><Icon name="arrow-up" solid /></button>
      </div>
    </div>
  );
}

// docked chat panel — identity adapts per destination/specialist
function ChatPanel({ specialist, role, messages, suggestions, onSend, onSuggest, onPrefs }){
  return (
    <aside className="dest__chat">
      <div className="chat__head">
        <div className="chat__who">
          <div className="chat__avatar"><Icon name="sparkles" solid /></div>
          <div><h4>{specialist}</h4><div className="role">{role}</div></div>
          <span className="live"><span className="d"></span>Live</span>
          {onPrefs && <button className="chat__prefs" title="Your preferences" onClick={onPrefs}><Icon name="sliders" /></button>}
        </div>
      </div>
      <ChatThread messages={messages} />
      {suggestions && suggestions.length > 0 && (
        <div className="chat__sugg">
          {suggestions.map((s,i) => <button key={i} onClick={() => onSuggest(s)}>{s}</button>)}
        </div>
      )}
      <DockInput onSend={onSend} />
    </aside>
  );
}

function FilterChip({ f, onRemove, flash }){
  return (
    <span className={'fchip' + (flash ? ' flash' : '')}>
      <span className="k">{f.k}:</span> {f.v}
      <button className="fchip__x" onClick={() => onRemove(f.id)} title={'Remove ' + f.k}><Icon name="xmark" solid /></button>
    </span>
  );
}

// reusable destination layout: header + a toolbar row + content, with docked chat
function DestShell({ title, countText, headerExtra, toolbar, children, chat }){
  return (
    <div className="dest">
      <div className="dest__main">
        <div className="results__head">
          <div>
            <div className="results__title">{title}</div>
            {countText && <div className="results__count">{countText}</div>}
          </div>
          <span style={{flex:1}}></span>
          {headerExtra}
        </div>
        {toolbar}
        {children}
      </div>
      <ChatPanel {...chat} />
    </div>
  );
}

// shared option card used by the onboarding flows (modal + in-chat)
function SelectCard({ active, multi, title, desc, icon, onClick }){
  return (
    <button type="button" className={"ob-card" + (active ? " is-active" : "")} onClick={onClick}>
      <span className={"ob-mark" + (multi ? " box" : "") + (active ? " on" : "")}>
        {active && <Icon name={multi ? "check" : "circle"} solid />}
      </span>
      {icon && <span className="ob-card-ic"><Icon name={icon} solid /></span>}
      <span className="ob-card-tx">
        <span className="ob-card-t">{title}</span>
        {desc && <span className="ob-card-d">{desc}</span>}
      </span>
    </button>
  );
}

Object.assign(window, { Icon, TopBar, Message, ChatThread, DockInput, ChatPanel, FilterChip, DestShell, SelectCard });

</script>
<script type="text/babel" data-src="ob-chat.jsx">
/* ============================================================
   Onboarding — IN-CHAT embedded variant.
   The same questionnaire, but it runs conversationally inside the
   AI console so people start chatting instead of facing a full-screen
   modal. Curated short path (OB_CHAT_STEPS). Saves the same profile.
   ============================================================ */

function ObTurn({ from, children }){
  return (
    <div className={"obc-row " + from}>
      <div className={"obc-av " + from}>{from === "me" ? "DO" : <Icon name="sparkles" solid />}</div>
      <div className="obc-bubble">{children}</div>
    </div>
  );
}

function InChatOnboarding({ onComplete, startDone = false }){
  const [a, setA] = useState(() => ({ ...obLoadProfile(), role: "", uses: [], markets: [], nationwide: false }));
  const [idx, setIdx] = useState(startDone ? OB_CHAT_STEPS.length : 0);
  const [done, setDone] = useState(startDone);
  const [marketInput, setMarketInput] = useState("");
  const [mktOpen, setMktOpen] = useState(false);
  const [chatInput, setChatInput] = useState("");
  const [msgs, setMsgs] = useState([]);
  const threadRef = useRef(null);
  const firstRender = useRef(true);
  const steps = OB_CHAT_STEPS;
  const total = steps.length;

  useEffect(() => {
    // Keep the welcome message in view on initial load; only auto-scroll once
    // the conversation actually progresses past the first step.
    if (firstRender.current) { firstRender.current = false; return; }
    if (threadRef.current) threadRef.current.scrollTop = threadRef.current.scrollHeight;
  }, [idx, done, a, msgs]);
  useEffect(() => { obSaveProfile(a, done); }, [a, done]);
  useEffect(() => { if (done && onComplete) onComplete(a); }, [done]);

  const set = (k, v) => setA((p) => ({ ...p, [k]: v }));
  const toggleArr = (k, v) => setA((p) => { const c = p[k] || []; return { ...p, [k]: c.includes(v) ? c.filter((x) => x !== v) : [...c, v] }; });
  const advance = () => { if (idx < total - 1) setIdx(idx + 1); else setDone(true); };
  const addMarket = (val) => { const v = (val != null ? val : marketInput).trim(); if (v && !a.markets.includes(v)) set("markets", [...a.markets, v]); setMarketInput(""); setMktOpen(false); };

  // market typeahead suggestions
  const mktMatches = (() => {
    const q = marketInput.trim().toLowerCase();
    if (!q) return [];
    const seen = new Set();
    const out = [];
    for (const m of (window.OB_MARKETS || [])){
      if (seen.has(m) || a.markets.includes(m)) continue;
      if (m.toLowerCase().includes(q)){ seen.add(m); out.push(m); }
      if (out.length >= 6) break;
    }
    return out;
  })();

  const meta = (k) => {
    if (k === "role") return { q: "First — what best describes your role?", sub: "I'll tailor language and defaults to how you work." };
    if (k === "uses") { const fc = FOCUS[roleGroup(a.role)]; return { q: fc.q, sub: fc.sub }; }
    if (k === "markets") return { q: "Which markets do you cover?", sub: "Add a few, or go nationwide." };
    if (k === "response") return { q: "Last one — how should I respond?", sub: "You can change this anytime." };
    return { q: "", sub: "" };
  };
  const answerText = (k) => {
    if (k === "role") return a.role;
    if (k === "uses") return (a.uses || []).join(", ");
    if (k === "markets") return a.nationwide ? "Nationwide" : (a.markets || []).join(", ");
    if (k === "response") return a.response;
    return "";
  };

  const pct = done ? 100 : Math.round((idx / total) * 100);
  const sendMsg = (text) => {
    const v = (text != null ? text : chatInput).trim(); if (!v) return;
    setMsgs((m) => [...m, { from: "me", text: v }, { from: "ai", text: `Got it — tuned for <b>${obProfileSummary(a) || "you"}</b>. Opening that now…` }]);
    setChatInput("");
  };

  /* ---- current interactive step card (called inline, not as a child component,
     so the markets text input keeps focus across keystrokes) ---- */
  function stepCard(){
    const k = steps[idx];
    const m = meta(k);
    if (k === "role") return (
      <div className="obc-card">
        <div className="obc-card-q">{m.q}</div><div className="obc-card-sub">{m.sub}</div>
        <div className="obc-opts">
          {OB_ROLES.map((r) => <SelectCard key={r.v} active={a.role === r.v} title={r.v} desc={r.d}
            onClick={() => { set("role", r.v); advance(); }} />)}
        </div>
        <div className="obc-actions"><span className="grow"></span><button className="obc-skip" onClick={advance}>Skip this</button></div>
      </div>
    );
    if (k === "uses"){ const fc = FOCUS[roleGroup(a.role)]; const opts = fc.opts || OB_USES; return (
      <div className="obc-card">
        <div className="obc-card-q">{m.q}</div><div className="obc-card-sub">{m.sub}</div>
        <div className="obc-opts">
          {opts.map((u) => <SelectCard key={u.v} multi active={a.uses.includes(u.v)} title={u.v} desc={u.d} icon={u.ic} onClick={() => toggleArr("uses", u.v)} />)}
        </div>
        <div className="obc-actions">
          <button className="obc-skip" onClick={advance}>Skip</button><span className="grow"></span>
          <button className="obc-continue" onClick={advance} disabled={a.uses.length === 0}>Continue <Icon name="arrow-right" solid /></button>
        </div>
      </div>
    ); }
    if (k === "markets") return (
      <div className="obc-card">
        <div className="obc-card-q">{m.q}</div><div className="obc-card-sub">{m.sub}</div>
        <button type="button" className={"ob-nationwide" + (a.nationwide ? " on" : "")} style={{marginBottom:'12px'}} onClick={() => set("nationwide", !a.nationwide)}>
          <span className={"ob-mark box" + (a.nationwide ? " on" : "")}>{a.nationwide && <Icon name="check" solid />}</span>
          <Icon name="globe" /> Nationwide
        </button>
        {!a.nationwide && (
          <>
            <div className="ob-market-field">
              <div className="ob-market-input">
                <Icon name="location-dot" />
                <input value={marketInput}
                  onChange={(e) => { setMarketInput(e.target.value); setMktOpen(true); }}
                  onFocus={() => setMktOpen(true)}
                  onBlur={() => setTimeout(() => setMktOpen(false), 150)}
                  onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addMarket(mktMatches[0] || marketInput); } else if (e.key === "Escape") { setMktOpen(false); } }}
                  placeholder="Search a city or metro…" />
                <button type="button" onClick={() => addMarket()} disabled={!marketInput.trim()}>Add</button>
              </div>
              {mktOpen && mktMatches.length > 0 && (
                <div className="ob-market-menu">
                  {mktMatches.map((mk) => (
                    <button type="button" key={mk} className="ob-market-opt" onMouseDown={(e) => { e.preventDefault(); addMarket(mk); }}>
                      <Icon name="location-dot" /> <span>{mk}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
            {a.markets.length > 0 && (
              <div className="ob-market-chips">
                {a.markets.map((mk) => <span className="ob-mchip" key={mk}>{mk}<button onClick={() => set("markets", a.markets.filter((x) => x !== mk))}><Icon name="xmark" solid /></button></span>)}
              </div>
            )}
          </>
        )}
        <div className="obc-actions">
          <button className="obc-skip" onClick={advance}>Skip</button><span className="grow"></span>
          <button className="obc-continue" onClick={advance}>Continue <Icon name="arrow-right" solid /></button>
        </div>
      </div>
    );
    if (k === "response") return (
      <div className="obc-card">
        <div className="obc-card-q">{m.q}</div><div className="obc-card-sub">{m.sub}</div>
        <div className="obc-opts one">
          {OB_RESPONSE.map((r) => <SelectCard key={r.v} active={a.response === r.v} title={r.v} desc={r.d} icon={r.ic}
            onClick={() => { set("response", r.v); advance(); }} />)}
        </div>
        <div className="obc-actions"><span className="grow"></span><button className="obc-skip" onClick={advance}>Skip this</button></div>
      </div>
    );
    return null;
  }

  return (
    <div className="console">
      <div className="console-glow"></div>
      <div className="console-inner">
        <div className="console-head">
          <div className="console-av"><Icon name="sparkles" solid /></div>
          <div className="console-id"><h4>Crexi assistant</h4><div className="r">{done ? "Tuned to how you work" : "Quick setup · " + (Math.min(idx + 1, total)) + " of " + total}</div></div>
          <div className="console-mini">
            {!done && <><div className="bar"><span style={{ width: pct + "%" }}></span></div><button className="obc-skip" onClick={() => setDone(true)}>Skip</button></>}
            {done && <span className="ob-rc" style={{fontSize:12}}><Icon name="circle-check" solid style={{color:'var(--cui-green-700)'}} /> Saved</span>}
          </div>
        </div>

        <div className="obchat" ref={threadRef}>
          <ObTurn from="ai">Welcome to Crexi, Dana. Before we dive in, <b>four quick things</b> so every answer fits how you work — about a minute, and you can skip anything.</ObTurn>

          {steps.slice(0, idx).map((k) => {
            const ans = answerText(k);
            return (
              <React.Fragment key={k}>
                <ObTurn from="ai">{meta(k).q}</ObTurn>
                <ObTurn from="me">{ans && ans.length ? ans : "I'll skip that for now"}</ObTurn>
              </React.Fragment>
            );
          })}

          {!done && idx < total && stepCard()}

          {done && (
            <>
              <ObTurn from="ai">Perfect — you're set. I've saved this to your profile, so it travels with you in every chat.{obProfileSummary(a) ? <> Tuned for <b>{obProfileSummary(a)}</b>.</> : null} Ask me anything below.</ObTurn>
              {msgs.map((mm, i) => <ObTurn key={i} from={mm.from}><span dangerouslySetInnerHTML={{ __html: mm.text }} /></ObTurn>)}
            </>
          )}
        </div>

        {done && (
          <div className="console-ready-row">
            {["Find retail comps in LA", "What's this parcel zoned for?", "Who owns this building?"].map((s) => <button key={s} onClick={() => sendMsg(s)}>{s}</button>)}
          </div>
        )}
      </div>
    </div>
  );
}

window.InChatOnboarding = InChatOnboarding;

</script>
<script type="text/babel" data-src="planning.jsx">
/* ============================================================
   Planning console — the "show its work, state the plan, confirm"
   step between a home query and landing in a destination.
     working  → animated reasoning steps
     plan     → states the plan + Yes / No CTA
     rejected → asks how to proceed (rephrase / go anyway / restart)
   ============================================================ */

function PlanningConsole({ query, route, onConfirm, onRevise, onHome }){
  const plan = buildPlan(route);
  const steps = plan.steps;
  const [n, setN] = useState(0);                 // index of the active (spinning) step
  const [phase, setPhase] = useState('working'); // working | plan | rejected
  const [reviseVal, setReviseVal] = useState('');
  const threadRef = useRef(null);

  useEffect(() => {
    let t;
    const run = (i) => {
      if (i >= steps.length){ t = setTimeout(() => setPhase('plan'), 480); return; }
      setN(i);
      t = setTimeout(() => run(i + 1), 640);
    };
    t = setTimeout(() => run(0), 480);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => { if (threadRef.current) threadRef.current.scrollTop = threadRef.current.scrollHeight; }, [n, phase]);

  const headState = phase === 'working' ? 'Working…' : phase === 'plan' ? 'Plan ready' : "Let's adjust";

  return (
    <main className="home planning">
      <div className="home__inner">
        <div className="home__hero">
          <div className="greeting fade-up">
            <div className="eyebrow">On it</div>
            <h1>Let me <span className="grad">line that up</span>.</h1>
          </div>

          <div className="console">
            <div className="console-glow"></div>
            <div className="console-inner">
              <div className="console-head">
                <div className="console-av"><Icon name="sparkles" solid /></div>
                <div className="console-id"><h4>Crexi assistant</h4><div className="r">{headState}</div></div>
                <button className="chat__prefs" title="Cancel" onClick={onHome}><Icon name="xmark" solid /></button>
              </div>

              <div className="obchat" ref={threadRef}>
                <div className="obc-row me"><div className="obc-av me">DO</div><div className="obc-bubble">{query}</div></div>

                {/* reasoning steps */}
                <div className="obc-row ai">
                  <div className="obc-av ai"><Icon name="sparkles" solid /></div>
                  <div className="obc-bubble" style={{ width: '100%' }}>
                    <div className="plan-steps">
                      {steps.map((s, i) => {
                        if (phase === 'working' && i > n) return null;
                        const done = phase !== 'working' || i < n;
                        return (
                          <div key={i} className={'plan-step ' + (done ? 'done' : 'active')}>
                            <span className="pin">{done ? <Icon name="check" solid /> : <span className="plan-spin"></span>}</span>
                            <span dangerouslySetInnerHTML={{ __html: s }} />
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>

                {/* the plan + confirm */}
                {phase !== 'working' && (
                  <div className="obc-row ai">
                    <div className="obc-av ai"><Icon name="sparkles" solid /></div>
                    <div className="obc-bubble" style={{ width: '100%' }}>
                      Given you want to <b>“{query}”</b>, here's my plan:
                      <div className="plancard">
                        <div className="plancard__head">
                          <span className="plancard__badge"><Icon name="bolt" solid /> {plan.tool}</span>
                        </div>
                        <p dangerouslySetInnerHTML={{ __html: plan.plan }} />
                        {phase === 'plan' && (
                          <div className="plan-cta">
                            <button className="ob-btn primary" onClick={onConfirm}><Icon name="arrow-right" solid /> Yes, let's go</button>
                            <button className="ob-btn ghost" onClick={() => setPhase('rejected')}>No, not quite</button>
                          </div>
                        )}
                        {phase === 'rejected' && (
                          <div className="plan-cta done"><span className="plan-declined"><Icon name="rotate" /> Plan set aside</span></div>
                        )}
                      </div>
                    </div>
                  </div>
                )}

                {phase === 'rejected' && (
                  <div className="obc-row ai">
                    <div className="obc-av ai"><Icon name="sparkles" solid /></div>
                    <div className="obc-bubble">
                      No problem — how would you like to proceed? Rephrase your request below, or:
                      <div className="console-ready-row" style={{ padding: '11px 0 0' }}>
                        <button onClick={onConfirm}>Take me there anyway</button>
                        <button onClick={onHome}>Start over</button>
                      </div>
                    </div>
                  </div>
                )}
              </div>

              {phase === 'rejected' && (
                <div className="console-foot">
                  <div className="console-inputrow ready">
                    <Icon name="sparkles" solid />
                    <input value={reviseVal} autoFocus
                      onChange={(e) => setReviseVal(e.target.value)}
                      onKeyDown={(e) => { if (e.key === 'Enter' && reviseVal.trim()) onRevise(reviseVal.trim()); }}
                      placeholder="Rephrase your request…" />
                    <button className="console-send" disabled={!reviseVal.trim()} onClick={() => reviseVal.trim() && onRevise(reviseVal.trim())}><Icon name="arrow-up" solid /></button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
    </main>
  );
}

window.PlanningConsole = PlanningConsole;

</script>
<script type="text/babel" data-src="history.jsx">
/* ============================================================
   Chat history — RecentRow (home strip) + HistoryView (full screen)
   Data + helpers (SESSIONS, SESSION_META, relTime, sessionBucket)
   live in data.js. Both reopen a session via onOpen(session).
   ============================================================ */

// --- compact card used in the home "pick up where you left off" row ---
function SessionCard({ s, onOpen, onDismiss }){
  const m = SESSION_META[s.dest] || {};
  return (
    <div className="sesscard" role="button" tabIndex={0} onClick={() => onOpen(s)}
      onKeyDown={(e) => { if (e.key === 'Enter') onOpen(s); }}>
      <span className="sesscard__ic" style={{ background:m.tint, color:m.color }}><Icon name={m.icon} solid /></span>
      <span className="sesscard__body">
        <span className="sesscard__q">{s.query}</span>
        <span className="sesscard__meta">
          <span className="sesscard__tool" style={{ color:m.color }}><span className="sesscard__dot" style={{ background:m.color }}></span>{m.label}</span>
          <span className="sesscard__sep">·</span>{relTime(s.hAgo)}
        </span>
      </span>
      <span className="sesscard__x" role="button" tabIndex={0} title="Remove from recents"
        onClick={(e) => { e.stopPropagation(); onDismiss(s.id); }}
        onKeyDown={(e) => { if (e.key === 'Enter'){ e.stopPropagation(); onDismiss(s.id); } }}><Icon name="xmark" solid /></span>
    </div>
  );
}

function RecentRow({ sessions, onOpen, onViewAll, onDismiss }){
  const recent = sessions.slice(0, 3);
  if (recent.length === 0) return null;
  return (
    <div className="recents fade-up" style={{ animationDelay:'.15s' }}>
      <div className="recents__head">
        <span className="recents__label"><Icon name="history" /> Pick up where you left off</span>
        <button className="recents__all" onClick={onViewAll}>View all history <Icon name="arrow-right" solid /></button>
      </div>
      <div className="recents__row">
        {recent.map(s => <SessionCard key={s.id} s={s} onOpen={onOpen} onDismiss={onDismiss} />)}
      </div>
    </div>
  );
}

// --- a row in the full history view ---
function HistRow({ s, onOpen, onDelete }){
  const m = SESSION_META[s.dest] || {};
  return (
    <div className="histrow" role="button" tabIndex={0} onClick={() => onOpen(s)}
      onKeyDown={(e) => { if (e.key === 'Enter') onOpen(s); }}>
      <span className="histrow__ic" style={{ background:m.tint, color:m.color }}><Icon name={m.icon} solid /></span>
      <span className="histrow__main">
        <span className="histrow__q">{s.query}</span>
        <span className="histrow__hint">{s.hint}</span>
      </span>
      <span className="histrow__tool"><span className="histrow__dot" style={{ background:m.color }}></span>{m.label}</span>
      <span className="histrow__time">{relTime(s.hAgo)}</span>
      <span className="histrow__del" role="button" tabIndex={0} title="Delete conversation"
        onClick={(e) => { e.stopPropagation(); onDelete(s.id); }}
        onKeyDown={(e) => { if (e.key === 'Enter'){ e.stopPropagation(); onDelete(s.id); } }}><Icon name="trash" /></span>
      <span className="histrow__go"><Icon name="arrow-right" solid /></span>
    </div>
  );
}

function HistoryView({ sessions, onOpen, onHome, onDelete }){
  const [q, setQ] = useState('');
  const [tool, setTool] = useState('all');

  const filtered = sessions.filter(s =>
    (tool === 'all' || s.dest === tool) &&
    (q.trim() === '' || (s.query + ' ' + s.hint).toLowerCase().includes(q.trim().toLowerCase()))
  );

  const buckets = ['today', 'week', 'earlier'].map(b => ({
    key: b, label: BUCKET_LABEL[b], items: filtered.filter(s => sessionBucket(s.hAgo) === b),
  })).filter(g => g.items.length > 0);

  const tools = [['all', 'All']].concat(Object.keys(SESSION_META).map(k => [k, SESSION_META[k].label]));

  return (
    <main className="home history">
      <div className="home__inner hist__inner">
        <div className="hist__head fade-up">
          <div>
            <div className="eyebrow">Chat history</div>
            <h1>Your <span className="grad">conversations</span></h1>
          </div>
          <button className="ob-btn ghost" onClick={onHome}><Icon name="arrow-left" solid /> Back to search</button>
        </div>

        <div className="hist__controls fade-up" style={{ animationDelay:'.05s' }}>
          <div className="hist__search">
            <Icon name="magnifying-glass" />
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search your past conversations…" />
            {q && <button className="hist__clear" onClick={() => setQ('')} title="Clear"><Icon name="xmark" solid /></button>}
          </div>
          <div className="hist__filters">
            {tools.map(([k, label]) => (
              <button key={k} className={'hist__chip' + (tool === k ? ' on' : '')} onClick={() => setTool(k)}>
                {k !== 'all' && <span className="hist__chipdot" style={{ background:SESSION_META[k].color }}></span>}{label}
              </button>
            ))}
          </div>
        </div>

        {buckets.length === 0 ? (
          <div className="hist__empty fade-up"><Icon name="magnifying-glass" /> No conversations match — try a different search or filter.</div>
        ) : buckets.map((g, gi) => (
          <div key={g.key} className="hist__group fade-up" style={{ animationDelay: (0.08 + gi * 0.04) + 's' }}>
            <div className="hist__grouph">{g.label} <span className="hist__count">{g.items.length}</span></div>
            <div className="hist__list">
              {g.items.map(s => <HistRow key={s.id} s={s} onOpen={onOpen} onDelete={onDelete} />)}
            </div>
          </div>
        ))}
      </div>
    </main>
  );
}

Object.assign(window, { SessionCard, RecentRow, HistRow, HistoryView });

</script>
<script type="text/babel" data-src="home.jsx">
/* ============================================================
   Home — Quiet Search (expandable cards + feature grid)
   Config (HOME_PROMPTS, CAP_CARDS, FEATURE_GROUPS) lives in data.js
   ============================================================ */

function ListingsWidget({ onSubmit }){
  const badge = (status) => {
    if (status === 'Active') return 'lw-badge lw-badge--ok';
    if (status === 'Needs attention') return 'lw-badge lw-badge--warn';
    return 'lw-badge lw-badge--muted';
  };
  return (
    <div className="lw fade-up" style={{animationDelay:'.14s'}}>
      <div className="lw__head">
        <span className="lw__title"><Icon name="building" solid /> Your Listings</span>
        <div className="lw__headright">
          <button className="lw__viewall" onClick={(e)=>e.preventDefault()} title="Out of scope for this test">View all <Icon name="arrow-right" solid /></button>
          <span className="lw-badge lw-badge--ok">Active</span>
          <button className="lw__more" title="Out of scope for this test"><Icon name="ellipsis-vertical" /></button>
        </div>
      </div>

      <div className="lw__rows">
        {MY_LISTINGS.map(l => (
          <div key={l.id} className="lwrow" role="button" tabIndex={0} title="Listing detail is out of scope for this test"
            onClick={(e)=>e.preventDefault()}>
            <span className="lwrow__thumb"></span>

// Typewriter placeholder — types an example, pauses, backspaces, moves on.
const TYPE_EXAMPLES = [
  'Find retail comps in LA that sold in the last year',
  'What is this parcel zoned for in Boca Raton, FL?',
  'Who owns this building — and how do I reach them?',
  'Properties likely to sell in Naperville, IL',
  'What retail space is for lease in Austin right now?',
];
function useTypewriter(examples, taRef){
  const [text, setText] = useState('');
  const [engaged, setEngaged] = useState(false); // true once the user focuses or types
  const st = useRef({ i: 0, pos: 0, phase: 'typing' }); // typing | pausing | deleting
  useEffect(() => {
    const el = taRef.current;
    let stopped = false;
    const stop = () => { stopped = true; setEngaged(true); setText(''); };
    if (el){ el.addEventListener('focus', stop); el.addEventListener('input', stop); }
    let timer;
    const tick = () => {
      if (stopped) return;
      const s = st.current;
      const full = examples[s.i % examples.length];
      let delay = 46;
      if (s.phase === 'typing'){
        s.pos++;
        setText(full.slice(0, s.pos));
        if (s.pos >= full.length){ s.phase = 'pausing'; delay = 1700; }
        else delay = 38 + Math.random() * 56;
      } else if (s.phase === 'pausing'){
        s.phase = 'deleting'; delay = 280;
      } else {
        s.pos--;
        setText(full.slice(0, Math.max(0, s.pos)));
        if (s.pos <= 0){ s.phase = 'typing'; s.i++; delay = 320; }
        else delay = 22;
      }
      timer = setTimeout(tick, delay);
    };
    timer = setTimeout(tick, 600);
    return () => { clearTimeout(timer); if (el){ el.removeEventListener('focus', stop); el.removeEventListener('input', stop); } };
  }, []);
  return engaged ? null : text;
}

              </div>
              <div className="owner__actions">
                <span className={'owner__status ' + (o.status==='Off-market'?'off':'act')}>{o.status}</span>
                {!revealed.includes(o.id) && <button className="btn btn--primary" onClick={() => onSkiptrace(o.id)}><Icon name="user-magnifying-glass" /> Skip trace</button>}
              </div>
            </div>
            {revealed.includes(o.id) && (
              <div className="owner__reveal">
                <div className="av">{o.contact.name.split(' ').map(w=>w[0]).slice(0,2).join('')}</div>
                <div style={{flex:1}}>
                  <div className="name">{o.contact.name}</div>
                  <div className="title">{o.contact.title} · {o.name}{o.contact.tenure!=='—' ? ' · '+o.contact.tenure : ''}</div>
                </div>
                <button className="btn btn--ghost"><Icon name="phone" /> Reveal contact</button>
                <button className="btn btn--ghost"><Icon name="address-book" /> Push to CRM</button>
                <span className="owner__credit"><Icon name="coins" /> 1 skip-trace credit</span>
              </div>
            )}
          </div>
        ))}
      </div>
    </DestShell>
  );
}

Object.assign(window, { MapExplorer, Marketplace, BizDev });

</script>
<script type="text/babel" data-src="app.jsx">
/* ============================================================
   App root — shared state, 6-agent routing, persistent chat
   ============================================================ */

const DEST_LABEL = { comps:'Comps & Records', map:'Map Explorer', bizdev:'Owners & Outreach', market:'Marketplace' };
const SUGGESTIONS = {
  comps:  ['Narrow to the last 6 months', 'Only over 6% cap rate', 'Show me the map'],
  map:    ['Add the flood & fire overlay', 'Layer in traffic', 'Show demographics'],
  market: ['Only for-lease', 'Industrial for sale', 'Show everything'],
  bizdev: ['Show only off-market owners', 'Save as an alert'],
};

function App(){
  const [screen, setScreen]   = useState('home');     // home | comps | map | bizdev | market
  const [routing, setRouting] = useState(null);       // null | destKey (while transitioning)
  const [messages, setMessages] = useState([]);
  const [specialist, setSpecialist] = useState('Comps specialist');
  const [role, setRole]       = useState('Sale comps · LA');
  const [toast, setToast]     = useState(null);

  // comps
  const [filters, setFilters] = useState([]);
  const [view, setView]       = useState('list');
  const [selected, setSelected] = useState(null);
  const [flashId, setFlashId] = useState(null);
  // map
  const [overlays, setOverlays] = useState(['zoning']);
  const [site, setSite]       = useState(null);
  const [mapSites, setMapSites] = useState(true);
  // market
  const [listingMode, setListingMode] = useState('all');
  const [listingType, setListingType] = useState(null);
  // bizdev
  const [ownerFilter, setOwnerFilter] = useState(null);
  const [revealed, setRevealed] = useState([]);
  // onboarding (in-chat) — always run the "Welcome to Intelligence" flow first on each load
  const [onboarded, setOnboarded] = useState(false);
  const [profile, setProfile] = useState(obLoadProfile);
  // planning / confirm step
  const [pending, setPending] = useState(null);   // { text, route }
  const [planKey, setPlanKey] = useState(0);       // remounts the console on each new/revised query
  // chat history (dismissible, persisted)
  const [sessions, setSessions] = useState(loadSessions);
  const dismissSession = (id) => { persistDismiss(id); setSessions(prev => prev.filter(s => s.id !== id)); };

  const timers = useRef([]);
  const after = (ms, fn) => { const t = setTimeout(fn, ms); timers.current.push(t); };
  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  const finishOnboarding = (a) => { after(1100, () => { setProfile({ ...a }); setOnboarded(true); }); };
  const editPrefs = () => { setScreen('home'); setOnboarded(false); };

  const rows = applyFilters(COMPS, filters);
  const pushMsgs = (prev, ...msgs) => [...prev.filter(m => !m.typing), ...msgs];
  const showToast = (text) => { setToast(text); after(3200, () => setToast(null)); };

  /* ---------- HOME → PLAN → DESTINATION ---------- */
  // A query first goes to the planning console (show work + state plan + confirm).
  const handleHomeSubmit = (text) => {
    const route = routeQuery(text);
    setPending({ text, route });
    setPlanKey(k => k + 1);
    setScreen('planning');
  };

  // re-plan with a revised request (from the "No" path)
  const revisePlan = (text) => {
    const route = routeQuery(text);
    setPending({ text, route });
    setPlanKey(k => k + 1);
  };

  // confirmed — actually land in the destination, seeding the docked thread
  const landRoute = (text, route) => {
    if (route.dest === 'comps'){ setFilters(route.filters || []); setView(route.view || 'list'); setSelected(null); }
    else if (route.dest === 'map'){ setOverlays(route.overlays || ['zoning']); setSite(null); setMapSites(route.sites !== false); }
    else if (route.dest === 'market'){ setListingMode(route.listingMode || 'all'); setListingType(null); }
    else if (route.dest === 'bizdev'){ setOwnerFilter(null); setRevealed([]); }
    setSpecialist(route.specialist); setRole(route.role);
    setMessages([{ from:'me', text }, { from:'ai', text: route.ack }, { from:'ai', text: route.handoff }]);
    setScreen(route.dest);
  };
  const confirmPlan = () => { if (pending) landRoute(pending.text, pending.route); };

  // reopen a past session straight into its destination (skips the plan step)
  const openSession = (s) => {
    const route = routeQuery(s.query);
    landRoute(s.query, route);
  };

  /* ---------- comps filter ops ---------- */
  const applyOps = (current, ops) => {
    let next = [...current]; let changed = null;
    for (const op of ops){
      if (op.type === 'setFilter' || op.type === 'addFilter'){
        const i = next.findIndex(f => f.id === op.payload.id);
        if (i >= 0) next[i] = op.payload; else next.push(op.payload);
        changed = op.payload.id;
      } else if (op.type === 'removeFilter'){ next = next.filter(f => f.id !== op.payload); }
      else if (op.type === 'setView'){ setView(op.payload); }
    }
    return { next, changed };
  };

  /* ---------- DOCKED REFINEMENTS (branch by screen) ---------- */
  const handleRefine = (text) => {
    setMessages(prev => [...prev, { from:'me', text }, { typing:true }]);
    after(720, () => {
      let reply = '';
      if (screen === 'comps'){
        const r = refineQuery(text); const { next, changed } = applyOps(filters, r.ops);
        setFilters(next);
        const count = applyFilters(COMPS, next).length;
        reply = (r.reply || '').replace(/\{COUNT\}/g, '<b>' + count + '</b>');
        if (changed){ setFlashId(changed); after(950, () => setFlashId(null)); }
      } else if (screen === 'map'){
        const r = refineMap(text, overlays);
        let next = overlays.slice();
        r.ops.forEach(op => { if (op.type === 'toggleOverlay'){ next = next.includes(op.payload) ? next.filter(x=>x!==op.payload) : [...next, op.payload]; } });
        setOverlays(next);
        reply = r.reply;
      } else if (screen === 'market'){
        const r = refineMarket(text);
        let mode = listingMode, type = listingType;
        r.ops.forEach(op => { if (op.type==='setListingMode') mode = op.payload; if (op.type==='setListingType') type = op.payload; });
        setListingMode(mode); setListingType(type);
        let rws = LISTINGS.filter(l => (mode==='all'||!mode||l.status===mode) && (!type||l.type===type));
        reply = (r.reply || '').replace(/\{COUNT\}/g, '<b>' + rws.length + '</b>');
      } else if (screen === 'bizdev'){
        const r = refineBizdev(text);
        r.ops.forEach(op => { if (op.type==='setOwnerFilter') setOwnerFilter(op.payload); if (op.type==='savedAlert') showToast('Saved as a standing alert'); });
        reply = r.reply;
      }
      setMessages(prev => pushMsgs(prev, { from:'ai', text: reply }));
    });
  };

  /* ---------- comps chip controls ---------- */
  const handleRemoveFilter = (id) => setFilters(prev => prev.filter(f => f.id !== id));
  const handleAddFilterClick = () => showToast('Tip: ask the assistant to add filters — e.g. “only over 6% cap rate.”');

  /* ---------- map / bizdev controls ---------- */
  const toggleOverlay = (id) => setOverlays(prev => prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);
  const handleSkiptrace = (id) => {
    setRevealed(prev => prev.includes(id) ? prev : [...prev, id]);
    const o = OWNERS.find(x => x.id === id);
    setMessages(prev => [...prev, { from:'ai', text:`Resolved <b>${o.name}</b> → <b>${o.contact.name}</b>, ${o.contact.title}. Reveal the verified contact, push to your CRM, or set an alert on this owner.` }]);
  };
  const handleSaveAlert = () => { showToast('Saved as a standing alert'); setMessages(prev => [...prev, { from:'ai', text:"Saved this owner set as a standing alert — I'll ping you when any of them list, sell, or refinance." }]); };

  /* ---------- PDP → Business Development (cross-destination handoff) ---------- */
  const handleRouteOwner = (row) => {
    setSelected(null);
    const match = OWNERS.find(o => o.name === row.owner) || OWNERS[0];
    setRouting('bizdev');
    after(900, () => {
      setSpecialist('Pipeline specialist'); setRole('Owners & outreach');
      setOwnerFilter(null); setRevealed([match.id]);
      setMessages(prev => [...prev, { from:'ai', text:`Carrying <b>${row.address}</b> into your pipeline. I resolved the owner to <b>${match.contact.name}</b> — reveal a verified contact, push to CRM, or set an alert on their other holdings.` }]);
      setScreen('bizdev'); setRouting(null);
    });
  };

  const goHome = () => { setScreen('home'); setSelected(null); setPending(null); };
  const openHistory = () => { setScreen('history'); setSelected(null); };
  const chat = { specialist, role, messages, suggestions: SUGGESTIONS[screen] || [], onSend: handleRefine, onSuggest: handleRefine, onPrefs: editPrefs };

  return (
    <>
      <TopBar crumb={screen !== 'home' ? (screen === 'history' ? 'History' : DEST_LABEL[screen]) : null} onHome={goHome}
        onPrefs={onboarded ? editPrefs : null} onHistory={onboarded ? openHistory : null} historyActive={screen === 'history'} />

      {screen === 'home' && !onboarded && <FirstRun onComplete={finishOnboarding} />}
      {screen === 'home' && onboarded && <Home onSubmit={handleHomeSubmit} profile={profile} onEditPrefs={editPrefs}
        sessions={sessions} onOpenSession={openSession} onViewAllHistory={openHistory} onDismissSession={dismissSession} />}

      {screen === 'history' && (
        <HistoryView sessions={sessions} onOpen={openSession} onHome={goHome} onDelete={dismissSession} />
      )}

      {screen === 'planning' && pending && (
        <PlanningConsole key={planKey} query={pending.text} route={pending.route}
          onConfirm={confirmPlan} onRevise={revisePlan} onHome={goHome} />
      )}

      {screen === 'comps' && (
        <CompsDestination
          filters={filters} onRemoveFilter={handleRemoveFilter} onAddFilterClick={handleAddFilterClick}
          flashId={flashId} rows={rows} totalCount={COMPS.length} view={view} setView={setView}
          chat={chat} selected={selected} setSelected={setSelected} onRouteOwner={handleRouteOwner} />
      )}
      {screen === 'map' && (
        <MapExplorer activeOverlays={overlays} onToggleOverlay={toggleOverlay} selected={site} setSelected={setSite} chat={chat} showSites={mapSites} />
      )}
      {screen === 'market' && (
        <Marketplace listingMode={listingMode} listingType={listingType} setListingMode={setListingMode} chat={chat} />
      )}
      {screen === 'bizdev' && (
        <BizDev ownerFilter={ownerFilter} revealed={revealed} onSkiptrace={handleSkiptrace} onSaveAlert={handleSaveAlert} chat={chat} />
      )}

      {routing && (
        <div className="routing">
          <div className="routing__card"><span className="spinner"></span> Routing you to {DEST_LABEL[routing]}…</div>
        </div>
      )}

      {toast && <div className="toast"><span className="ico"><Icon name="circle-check" solid /></span>{toast}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
